 {id:'lt',name:'Language Transfer · Introduction to Italian',url:'https://www.languagetransfer.org/italian',skill:'Grammar',level:'A0–A1',format:'Audio',phase:'1–2',access:'Provider describes the introduction as free. Account requirements could not be checked here.',how:'Use the numbered tracks in order, at most two short tracks per session. Pause at each question, build and speak an answer, compare, then repeat the difficult section. Save your next track number in the lab. Tracks are not mapped to invented lesson titles.',limit:'Introduction only; not a complete curriculum.'},

 {id:'easy',name:'Easy Italian / Super Easy Italian',url:'https://www.easy-languages.org/easy-italian',skill:'Listening',level:'A1–B1',format:'Video',phase:'2–4',access:'Use freely available videos. Membership materials are not required. External video services may show ads.',how:'Start with a Super Easy Italian video matching today’s topic. Listen for the gist, replay a 30–60 second section, collect two useful phrases, then repeat them aloud. Interviews are an optional later challenge.',limit:'Subtitles are scaffolding: try without them first, then use Italian and English to check.'},

const q = (type,prompt,answers,why,choices) => ({type,prompt,answers:Array.isArray(answers)?answers:[answers],why,...(choices?{choices}:{} )});
const mc = (p,a,c,w) => q('choice',p,a,w,c);
const fill = (p,a,w) => q('fill',p,a,w);
const tr = (p,a,w) => q('translate',p,a,w);
const order = (p,a,w) => q('order',p,a,w);
const v = (it,en,example,de='',note='') => [it,en,example,de,note];
const TOPICS = {};
function topic(id,title,objective,explain,de,examples,vocab,questions,dialogue,listen,speak,write,resource='oic'){
 TOPICS[id]={id,title,objective,explain,de,examples,vocab,questions,dialogue,listen,speak,write,resource};
}

topic('hello','Your first conversation','Greet someone, give your name and ask theirs.',
 'Ciao is an informal hello or goodbye. Buongiorno is a polite daytime greeting; buonasera is used later in the day. Mi chiamo means “my name is”, literally “I call myself”. Come ti chiami? is informal. Italian normally omits subject pronouns when the verb makes the person clear. Read the examples, cover them, then answer aloud before checking.',
 'Like German heißen, chiamarsi expresses what someone is called, but Italian uses a reflexive form: mi chiamo. Ciao is informal like Hallo, not a universal formal greeting.',
 [['Ciao, mi chiamo Jannik.','Hi, my name is Jannik.'],['Come ti chiami?','What is your name?'],['Piacere!','Nice to meet you!']],
 [v('ciao','hi / bye','Ciao, Anna!'),v('buongiorno','hello / good morning','Buongiorno, signora!'),v('mi chiamo','my name is','Mi chiamo Jannik.','ich heiße','mi chiamo + name'),v('come ti chiami?','what is your name?','Ciao! Come ti chiami?'),v('piacere','nice to meet you','Piacere, sono Anna.'),v('grazie','thank you','Grazie, Luca!','danke')],
 [mc('A polite daytime greeting to a stranger:', 'Buongiorno',['Ciao','Buongiorno','Arrivederci'],'Buongiorno is appropriate in polite situations.'),fill('Mi ___ Jannik.','chiamo','Mi chiamo + name. The ending -o goes with io.'),tr('Say: My name is Jannik.',['Mi chiamo Jannik','Io mi chiamo Jannik'],'Mi chiamo is the idiomatic introduction.'),order('Build: What is your name?','Come ti chiami','Come + ti + chiami. The question mark does not change word order.'),tr('Translate to English: Grazie.',['Thank you','Thanks'],'Grazie means thank you; it is not a greeting.'),fill('___! (Nice to meet you!)','Piacere','Piacere is a natural first-meeting response.')],
 'Anna: Ciao, mi chiamo Anna. Come ti chiami?\nJannik: Mi chiamo Jannik.\nAnna: Piacere, Jannik!\nJannik: Piacere!',[mc('What is the first speaker’s name?','Anna',['Anna','Giulia','Luca'],'Anna introduces herself with mi chiamo Anna.'),mc('What does Anna ask?','His name',['His age','His name','His address'],'Come ti chiami? asks for a name.')],
 'Without looking, greet a new acquaintance, say your name, ask their name and say “nice to meet you”. Repeat with a polite opening. Aim for four short turns.',
 'Write a four-line introduction dialogue using your own name. Cover the examples first.','lt');

topic('sounds','Hear it, say it','Distinguish c / ch, g / gh and short versus double consonants.',
 'The traditional Italian alphabet has 21 letters: a, b, c, d, e, f, g, h, i, l, m, n, o, p, q, r, s, t, u, v, z. Their names are a, bi, ci, di, e, effe, gi, acca, i, elle, emme, enne, o, pi, cu, erre, esse, ti, u, vi (also vu), zeta. J, k, w, x and y occur in borrowed words and names. Before e or i, c sounds like English “ch” and g like “j”: cena, gelato. Add h to keep the hard sound: che, spaghetti. Before a, o, u they are hard: casa, gatto. Gli and gn need listening practice (famiglia, bagno). Hold double consonants longer: pala and palla are different words. Stress is often on the penultimate syllable, but exceptions must be learned. The five written vowels can represent seven stressed vowel qualities; start with clear, steady vowels.',
 'German helps with crisp vowels and keeping written sounds. Italian gn is like the joined sound in Spanish ñ, not a separate g + n. Italian ch is a hard k, unlike German ich or ach.',
 [['ciao / casa','soft c / hard c'],['gelato / spaghetti','soft g / hard gh'],['pala / palla','shovel / ball']],
 [v('casa','house / home','La casa è bella.','Haus'),v('gelato','ice cream','Vorrei un gelato.'),v('spaghetti','spaghetti','Mangio gli spaghetti.','Spaghetti','Plural noun'),v('bagno','bathroom','Dov’è il bagno?'),v('famiglia','family','La mia famiglia è in Germania.','Familie'),v('palla','ball','La palla è rossa.','Ball','Hold the double l')],
 [mc('The c in cena sounds approximately like:','English ch',['English k','English ch','German z'],'Before e/i, c is normally soft.'),mc('Which spelling keeps a hard k before e?','che',['ce','che','sce'],'The h preserves the hard c sound.'),mc('What changes between pala and palla?','Consonant duration',['Only punctuation','Consonant duration','The final vowel'],'Double consonants are meaningful in Italian.'),fill('Complete the spelling for ice cream: ___','gelato','G before e is soft, like j in English.'),tr('Translate to English: famiglia',['family','the family'],'Famiglia is family.'),order('Build: My name is Jannik.','Mi chiamo Jannik','The h in chiamo preserves a hard k sound.')],
 'Ciao! Mi chiamo Chiara. La mia famiglia è in Italia. A casa mangio un gelato.',[mc('Who is speaking?','Chiara',['Chiara','Carla','Anna'],'The speaker says Mi chiamo Chiara.'),mc('What food is mentioned?','Ice cream',['Bread','Ice cream','Pasta'],'Gelato means ice cream.')],
 'Say ciao, casa, che, gelato, spaghetti, bagno and famiglia slowly. Then say pala and palla with a clearly longer l in palla. Compare with an Italian voice if one is installed.',
 'Make two columns: hard c/g and soft c/g. Sort ciao, casa, che, gelato, gatto and spaghetti. Check the rule.','lt');

topic('essere','Who you are','Use essere to give nationality and identify a person.',
 'Essere means “to be”: (io) sono, (tu) sei, (lui/lei) è, (noi) siamo, (voi) siete, (loro) sono. Use sono for both “I am” and “they are”; context or a pronoun disambiguates. È has an accent and means “is”; e without one means “and”. Nationality adjectives are normally lowercase and agree with the person: tedesco / tedesca, tedeschi / tedesche.',
 'Essere is irregular like sein: sono = ich bin, sei = du bist, è = er/sie ist. Unlike German, you can normally leave out io or tu. Do not capitalize nationalities as German nouns.',
 [['Sono tedesco.','I am German.'],['Anna è italiana.','Anna is Italian.'],['Siamo studenti.','We are students.']],
 [v('sono','I am / they are','Sono tedesco.','ich bin / sie sind'),v('sei','you are (informal singular)','Sei italiano?','du bist'),v('è','he / she / it is','Anna è italiana.','ist','Accent distinguishes è from e'),v('tedesco','German (masculine)','Sono tedesco.','deutsch'),v('italiano','Italian (masculine)','Luca è italiano.','italienisch'),v('studente','student (male)','Sono uno studente.','Student','Female: studentessa')],
 [fill('Io ___ tedesco.','sono','Io takes sono.'),fill('Anna ___ italiana.','è','Lei takes è. The accent is required.'),mc('“We are” is:','siamo',['sono','siete','siamo'],'Noi siamo.'),tr('Say: You are Italian. (to one man)',['Sei italiano','Tu sei italiano'],'Tu sei + masculine italiano.'),order('Build: Anna is Italian.','Anna è italiana','Use è and feminine italiana.'),mc('Which means “and”?','e',['è','e','sei'],'Unaccented e means and.')],
 'Luca: Ciao, sono Luca. Sono italiano. Sei tedesco?\nJannik: Sì, sono tedesco. Sono studente.\nLuca: Piacere!',[mc('Where is Luca from?','Italy',['Germany','Italy','England'],'He says Sono italiano.'),mc('Is Jannik a student?','Yes',['Yes','No','Not stated'],'He says Sono studente.')],
 'Give your name, nationality and role. Ask a partner whether they are Italian. Repeat with noi siamo studenti.',
 'Write three sentences: one about yourself, one about Anna, and one about you and a friend. Use sono, è and siamo.','lt');

topic('numbers','Numbers and age','Say numbers from 0–30 and state your age with avere.',
 'Learn 0–10 first: zero, uno, due, tre, quattro, cinque, sei, sette, otto, nove, dieci. Then undici, dodici, tredici, quattordici, quindici, sedici, diciassette, diciotto, diciannove, venti. Continue: ventuno, ventidue, ventitré, ventiquattro, venticinque, ventisei, ventisette, ventotto, ventinove, trenta. Ventitré has a written accent. In Italian you “have” years: Ho ventitré anni, not sono ventitré. Avere begins ho, hai, ha; the h is silent.',
 'German and English use “be” for age (ich bin 23 / I am 23). Italian uses avere: ho 23 anni. Italian compound numbers put tens before units, unlike dreiundzwanzig.',
 [['Ho ventitré anni.','I am twenty-three.'],['Quanti anni hai?','How old are you?'],['Ho due libri.','I have two books.']],
 [v('ho','I have','Ho ventitré anni.','ich habe','Silent h'),v('hai','you have','Quanti anni hai?','du hast'),v('anni','years','Ho ventitré anni.','Jahre'),v('due','two','Ho due libri.'),v('dieci','ten','Sono le dieci.'),v('ventitré','twenty-three','Ho ventitré anni.','dreiundzwanzig','Final written accent')],
 [fill('___ ventitré anni.','Ho','Italian uses avere for age.'),tr('Write the number 3 in Italian.','tre','Tre has no accent when written alone.'),mc('Which is 21?','ventuno',['ventiuno','ventuno','dodici'],'Venti loses its final vowel before uno.'),fill('Quanti anni ___? (informal you)','hai','Tu hai.'),tr('Say: I am twenty-three years old.',['Ho ventitré anni','Io ho ventitré anni','Ho 23 anni'],'Use avere, not essere.'),order('Build: How old are you?','Quanti anni hai','Quanti + anni + hai.')],
 'Anna: Quanti anni hai?\nJannik: Ho ventitré anni. E tu?\nAnna: Ho venti anni.',[mc('How old is Jannik?','23',['20','23','30'],'Ventitré is 23.'),mc('How old is Anna?','20',['20','23','12'],'Venti is 20.')],
 'Count 0–10, then 11–20. Say your age and ask someone theirs. Say 21, 23 and 28 separately; do not rush.',
 'Write a short age exchange. Then write five random numbers between 0 and 30 in words. Check spelling.','lt');

topic('articles','People and things','Choose basic indefinite articles and identify noun gender.',
 'Learn a noun with its article. Many nouns in -o are masculine and many in -a feminine; nouns in -e can be either. “A/an” is un before most masculine nouns (un libro), uno before s + consonant, z and certain other clusters (uno studente), una before feminine consonants (una casa), and un’ before feminine vowels (un’amica). Masculine un amico has no apostrophe. Gender is grammatical, not a reliable description of an object.',
 'As with der/die/das, memorize the article and noun together. Italian has masculine and feminine, no neuter. “Un amico” versus “un’amica” marks a meaningful gender difference.',
 [['un libro / una casa','a book / a house'],['uno studente / un’amica','a male student / a female friend'],['un amico','a male friend']],
 [v('un libro','a book','Ho un libro.','ein Buch','libro is masculine'),v('una casa','a house','È una casa.','ein Haus','casa is feminine'),v('uno studente','a male student','Sono uno studente.'),v('un’amica','a female friend','Anna è un’amica.','eine Freundin','Apostrophe with feminine vowel'),v('un amico','a male friend','Luca è un amico.','ein Freund','No apostrophe with masculine un'),v('una lezione','a lesson','È una lezione di italiano.','eine Lektion','Feminine noun ending in -e')],
 [fill('___ libro (a book)','un','Libro is masculine; use un.'),fill('___ casa (a house)','una','Casa is feminine.'),mc('Choose “a female friend”.','un’amica',['un amica','un’amica','uno amica'],'Una becomes un’ before a vowel.'),mc('Choose “a male friend”.','un amico',['un’amico','un amico','una amico'],'Masculine un has no apostrophe.'),fill('___ studente (a male student)','uno','Use uno before s + consonant.'),tr('Translate: a lesson',['una lezione'],'Lezione is feminine despite ending in -e.')],
 'Ho un libro e una penna. Anna è un’amica. Luca è uno studente. La lezione è in italiano.',[mc('What does the narrator have?','A book and a pen',['A book and a pen','Two houses','A coffee'],'Un libro e una penna.'),mc('Who is a student?','Luca',['Anna','Luca','No one'],'Luca è uno studente.')],
 'Point to three objects and name them with an article. Introduce one male and one female friend using un amico and un’amica.',
 'Write six noun-and-article pairs from today. Mark masculine or feminine; underline any apostrophe.');

topic('plurals','One, two, many','Form common plurals and use definite articles.',
 'Common noun plurals: -o → -i (libro/libri), -a → -e for feminine nouns (casa/case), -e → -i (lezione/lezioni). There are exceptions, so learn irregulars separately. Definite articles: il libro → i libri; lo studente → gli studenti; l’amico → gli amici; la casa → le case; l’amica → le amiche. Both masculine and feminine singular nouns can use l’ before a vowel, but the plural reveals gender.',
 'German plural endings vary widely; the Italian patterns cover many everyday nouns but are not universal. Amica → amiche retains the hard k sound with h.',
 [['il libro → i libri','the book → the books'],['la casa → le case','the house → the houses'],['lo studente → gli studenti','the student → the students']],
 [v('i libri','the books','I libri sono qui.','die Bücher'),v('le case','the houses','Le case sono belle.','die Häuser'),v('gli studenti','the students','Gli studenti sono italiani.','die Studenten'),v('le lezioni','the lessons','Le lezioni sono interessanti.'),v('gli amici','the male / mixed friends','Gli amici sono qui.'),v('le amiche','the female friends','Le amiche sono italiane.','die Freundinnen','h preserves hard c')],
 [fill('il libro → i ___','libri','Most masculine nouns in -o form plurals in -i.'),fill('la casa → le ___','case','Feminine -a usually changes to -e.'),mc('The plural of lo studente is:','gli studenti',['i studenti','gli studenti','le studente'],'Lo becomes gli.'),tr('Translate: the lessons','le lezioni','Lezione is feminine; plural lezioni takes le.'),fill('l’amica → le ___','amiche','Add h to preserve the hard k sound.'),order('Build: The students are Italian.','Gli studenti sono italiani','Gli + studenti + sono + plural italiani.')],
 'Gli studenti sono in classe. I libri sono qui. Le lezioni sono in italiano. Anna e Luca sono amici.',[mc('Where are the students?','In class',['At home','In class','At a café'],'In classe means in class.'),mc('In what language are the lessons?','Italian',['English','German','Italian'],'In italiano.')],
 'Name one book, then several books; one house, then several houses. Include the definite article each time.',
 'Transform four singular phrases into plurals, including an -e noun and a noun beginning with a vowel.');

topic('avere','What you have','Use all present-tense forms of avere and common expressions.',
 'Avere: ho, hai, ha, abbiamo, avete, hanno. The h is written but silent. A and ha sound the same but have different jobs: a is a preposition; ha means “has”. Use avere for age, hunger and thirst: ho fame, ho sete. Non goes immediately before the verb: non ho fame. Subject pronouns are useful for contrast but usually optional.',
 'Ho fame resembles German ich habe Hunger. Ho freddo/ho caldo use avere too, while German says mir ist kalt/warm. Do not confuse Italian ho with German wo.',
 [['Ho fame, ma non ho sete.','I am hungry, but I am not thirsty.'],['Abbiamo una lezione.','We have a lesson.'],['Loro hanno due libri.','They have two books.']],
 [v('ho fame','I am hungry','Ho fame: mangio una pizza.','ich habe Hunger'),v('ho sete','I am thirsty','Ho sete: bevo acqua.','ich habe Durst'),v('abbiamo','we have','Abbiamo una casa.'),v('avete','you have (plural)','Avete un libro?'),v('hanno','they have','Hanno due figli.','sie haben','Silent h'),v('non','not','Non ho fame.','nicht','Place before the verb')],
 [fill('Noi ___ due libri.','abbiamo','Noi takes abbiamo.'),fill('Loro ___ fame.','hanno','Loro takes hanno.'),tr('Say: I am not thirsty.',['Non ho sete','Io non ho sete'],'Non before ho; thirst uses avere.'),mc('Which means “she has”?','ha',['a','ha','è'],'Ha with h is a verb.'),order('Build: We have a lesson.','Abbiamo una lezione','The subject pronoun noi is optional.'),fill('Voi ___ un libro?','avete','Voi takes avete.')],
 'Anna ha fame. Luca ha sete. Abbiamo acqua e pane. Non abbiamo caffè.',[mc('Who is thirsty?','Luca',['Anna','Luca','Everyone'],'Luca ha sete.'),mc('What is unavailable?','Coffee',['Water','Bread','Coffee'],'Non abbiamo caffè.')],
 'Say what you have in your bag, what you do not have, and whether you are hungry or thirsty. Ask two questions with hai.',
 'Write four sentences using ho, ha, abbiamo and hanno. Make one negative.','lt');

topic('are','What you do','Conjugate regular -are verbs in the present tense.',
 'Remove -are and add -o, -i, -a, -iamo, -ate, -ano: parlo, parli, parla, parliamo, parlate, parlano. One present form can mean both “I speak” and “I am speaking”. Studio italiano means I study Italian; no article is needed here. Italian does not use English do-support: Parli italiano? uses the same word order as a statement.',
 'Compare German lernen: the subject affects the ending. Italian can omit the subject because the ending often identifies it. English “do you speak?” has no separate do in Italian.',
 [['Parlo tedesco e inglese.','I speak German and English.'],['Studio italiano a casa.','I study Italian at home.'],['Parli italiano?','Do you speak Italian?']],
 [v('parlo','I speak','Parlo tedesco.'),v('studio','I study','Studio italiano a casa.'),v('abito','I live','Abito a Londra.','ich wohne'),v('lavoro','I work','Lavoro a casa.'),v('ascolto','I listen','Ascolto una lezione.'),v('imparo','I learn','Imparo l’italiano.','ich lerne')],
 [fill('Io ___ italiano. (parlare)','parlo','Parl- + -o.'),fill('Noi ___ a casa. (studiare)','studiamo','Studi- + -iamo becomes studiamo, with one i.'),tr('Say: I speak German.',['Parlo tedesco','Io parlo tedesco'],'Use parlo + language without an article.'),mc('“Do you study Italian?” is:','Studi italiano?',['Fai studi italiano?','Studi italiano?','Studia italiano?'],'Tu studi. No do-support.'),order('Build: I live in London.','Abito a Londra','Use a with a city.'),fill('Loro ___ italiano. (parlare)','parlano','Loro takes -ano.')],
 'Mi chiamo Jannik. Parlo tedesco e inglese. Abito a Londra. Studio italiano a casa. Anna studia con me.',[mc('Where does Jannik live?','London',['Rome','London','Berlin'],'Abito a Londra.'),mc('Where does he study Italian?','At home',['At home','On a train','At a restaurant'],'A casa.')],
 'Speak for 30 seconds about the languages you speak, where you live and what you study. Then ask a partner the same questions.',
 'Write six sentences using different people with parlare and studiare.');

topic('ere_ire','Read, take, sleep','Use regular -ere and -ire verbs and recognise the -isc- group.',
 'Regular -ere: prendo, prendi, prende, prendiamo, prendete, prendono. Regular -ire: dormo, dormi, dorme, dormiamo, dormite, dormono. Some -ire verbs add -isc- in io, tu, lui/lei and loro: capisco, capisci, capisce, capiamo, capite, capiscono. Learn which family a verb belongs to; not all -ire verbs use -isc-.',
 'English “take” is often prendere, including ordering: prendo un caffè. Capire means verstehen. Do not apply one regular ending pattern to every verb.',
 [['Leggo un libro.','I read a book.'],['Prendo un caffè.','I’ll have a coffee.'],['Non capisco.','I don’t understand.']],
 [v('leggo','I read','Leggo un libro.','ich lese'),v('prendo','I take / I’ll have','Prendo un caffè.'),v('dormo','I sleep','Dormo bene.'),v('capisco','I understand','Capisco la domanda.','ich verstehe','-isc- verb'),v('non capisco','I don’t understand','Scusa, non capisco.'),v('preferisco','I prefer','Preferisco il tè.','ich bevorzuge','-isc- verb')],
 [fill('Io ___ un libro. (leggere)','leggo','Legg- + -o.'),fill('Noi ___ bene. (dormire)','dormiamo','Dorm- + -iamo.'),fill('Io ___ italiano. (capire)','capisco','Capire uses -isc- in the io form.'),mc('Which is “we understand”?','capiamo',['capisciamo','capiamo','capiscono'],'No -isc- with noi.'),tr('Say: I don’t understand.',['Non capisco','Io non capisco'],'Non precedes the verb.'),order('Build: I’ll have a coffee.','Prendo un caffè','Prendere is useful for ordering.')],
 'Anna legge un libro. Io prendo un caffè. Non capisco una parola. Anna ripete la parola e io capisco.',[mc('What is Anna doing first?','Reading',['Sleeping','Reading','Shopping'],'Anna legge un libro.'),mc('What helps the narrator understand?','Anna repeats the word',['A dictionary','Anna repeats the word','A menu'],'Anna ripete la parola.')],
 'Order a coffee, say you do not understand, and ask for help using Puoi ripetere? as a useful chunk.',
 'Conjugate prendere and dormire for io, noi and loro. Add two sentences with capisco and capiamo.');

topic('questions','Ask and find out','Use basic question words and put non before the verb.',
 'Chi = who; che cosa/cosa = what; dove = where; come = how; quando = when; perché = why/because. Italian questions often keep statement order and use intonation. Dove abiti? asks where you live. Di dove sei? asks where you are from. Non precedes the verb: non sono italiano. Perché ends with an acute accent.',
 'Unlike German, questions do not require subject–verb inversion in the same way. Dove abiti? is natural without tu. Perché is both warum and weil; context makes the difference.',
 [['Di dove sei?','Where are you from?'],['Dove abiti?','Where do you live?'],['Perché studi italiano?','Why do you study Italian?']],
 [v('dove','where','Dove abiti?','wo'),v('quando','when','Quando studi?','wann'),v('perché','why / because','Studio perché mi piace.','warum / weil','Final acute accent'),v('chi','who','Chi è?','wer'),v('che cosa','what','Che cosa studi?','was'),v('puoi ripetere?','can you repeat?','Scusa, puoi ripetere?','Kannst du das wiederholen?')],
 [mc('Which asks about origin?','Di dove sei?',['Dove abiti?','Di dove sei?','Quando studi?'],'Di dove sei asks where you are from.'),fill('___ studi? — La sera. (When)','Quando','Quando asks about time.'),tr('Say: I am not Italian. (male)',['Non sono italiano','Io non sono italiano'],'Non goes before sono.'),order('Build: Where do you live?','Dove abiti','Dove + abiti.'),mc('Perché can mean:','Why or because',['Only where','Why or because','How much'],'One word can ask or explain a reason.'),fill('___ è? — È Anna. (Who)','Chi','Chi asks who.')],
 'Luca: Dove abiti?\nJannik: Abito a Londra.\nLuca: Quando studi italiano?\nJannik: La sera, a casa.',[mc('When does Jannik study?','In the evening',['In the morning','In the evening','At midday'],'La sera.'),mc('Does he study at home?','Yes',['Yes','No','Not stated'],'A casa.')],
 'Ask six questions using six different question words. Answer three of them about yourself, without reading your written answers.',
 'Write three question-and-answer pairs; include one negative answer.');

topic('agreement','Describe your world','Make adjectives agree and distinguish adjective and adverb uses.',
 'Many adjectives have four forms: italiano, italiana, italiani, italiane. An adjective in -e often has plural -i: interessante → interessanti. Most ordinary descriptive adjectives can follow the noun: un libro interessante. Position can change meaning with some adjectives; learn common combinations. Bene means well; buono means good. Say sto bene, but un buon caffè.',
 'Italian adjectives agree even after essere: le case sono belle. German predicate adjectives normally stay unchanged: die Häuser sind schön. This is a key difference.',
 [['La casa è bella.','The house is beautiful.'],['I libri sono interessanti.','The books are interesting.'],['Anna e Giulia sono italiane.','Anna and Giulia are Italian.']],
 [v('bello','beautiful / nice','Il libro è bello.','schön','bello, bella, belli, belle'),v('interessante','interesting','La lezione è interessante.','interessant','Plural interessanti'),v('piccolo','small','La casa è piccola.','klein'),v('grande','big','La casa è grande.','groß','Plural grandi'),v('bene','well','Sto bene.','gut','Adverb; does not agree'),v('buono','good','Il caffè è buono.','gut','Adjective; agrees')],
 [fill('Le case sono ___. (bello)','belle','Feminine plural: belle.'),fill('I libri sono ___. (interessante)','interessanti','Adjectives in -e change to -i in the plural.'),mc('“Anna is Italian” is:','Anna è italiana',['Anna è italiano','Anna è italiana','Anna è italiane'],'Match feminine singular Anna.'),tr('Say: The house is small.','La casa è piccola','Casa and piccola are feminine singular.'),order('Build: The books are interesting.','I libri sono interessanti','Plural noun and adjective.'),mc('Complete: Sto ___.','bene',['buono','bene','belli'],'Bene describes how you are doing.')],
 'La mia casa è piccola. Le finestre sono grandi. Ho due libri interessanti. Il caffè è buono.',[mc('How is the house described?','Small',['Big','Small','Old'],'La casa è piccola.'),mc('What is interesting?','The books',['The windows','The books','The coffee'],'Due libri interessanti.')],
 'Describe three things around you using an article, noun and adjective. Then describe two of them in the plural.',
 'Write four descriptions: masculine singular, feminine singular, masculine plural and feminine plural.');

topic('home','Where you live','Use a, in and di in high-frequency location phrases.',
 'Use a with most city names: a Londra, a Roma. Use in with countries: in Germania, in Italia. A casa is a fixed expression for at home; in centro means in the city centre. Di expresses origin or possession: sono di Berlino, il libro di Anna. These are useful starting patterns, not universal rules for every place name.',
 'German distinguishes location and movement with case in many prepositions. Italian does not mirror those cases: abito a Roma and vado a Roma use a. Learn a/in as phrase patterns.',
 [['Abito a Londra, in Inghilterra.','I live in London, in England.'],['Sono di Berlino.','I am from Berlin.'],['Studio a casa.','I study at home.']],
 [v('a casa','at home','Studio a casa.','zu Hause'),v('in centro','in the city centre','Abito in centro.'),v('a Londra','in / to London','Abito a Londra.'),v('in Germania','in / to Germany','La mia famiglia è in Germania.'),v('di','of / from','Sono di Berlino.','von / aus'),v('con','with','Studio con Anna.','mit')],
 [fill('Abito ___ Londra.','a','Use a with cities such as Londra.'),fill('Abito ___ Germania.','in','Use in with countries such as Germania.'),tr('Say: I study at home.',['Studio a casa','Io studio a casa'],'A casa is the usual phrase.'),order('Build: Anna’s book.','Il libro di Anna','Possession: noun + di + owner.'),mc('“With Anna” is:','con Anna',['di Anna','con Anna','a Anna'],'Con means with.'),fill('Sono ___ Berlino. (from)','di','Di + city can express origin.')],
 'Sono di Berlino, ma abito a Londra. La mia famiglia è in Germania. Studio italiano a casa con Anna.',[mc('Where does the narrator live now?','London',['Berlin','London','Rome'],'Abito a Londra.'),mc('Where is the family?','Germany',['Italy','Germany','England'],'In Germania.')],
 'Give a 45–60 second introduction: name, age, nationality, languages, home and reason for learning. Look only at keywords; then try without them.',
 'Write a six-sentence personal profile. Use a with a city, in with a country, and con with a person.');

topic('irregular','Go, do, stay','Use andare, fare and stare for daily activities.',
 'Andare: vado, vai, va, andiamo, andate, vanno. Fare: faccio, fai, fa, facciamo, fate, fanno. Stare: sto, stai, sta, stiamo, state, stanno. Learn useful chunks first: vado all’università, faccio colazione, sto bene. Do not force regular endings onto these verbs.',
 'Fare covers both machen and tun. English “have breakfast” becomes fare colazione. Stare is used in sto bene; essere still identifies a person or nationality.',
 [['Vado all’università.','I go to university.'],['Faccio colazione a casa.','I have breakfast at home.'],['Come stai?','How are you?']],
 [v('vado','I go','Vado a Roma.'),v('faccio','I do / make','Faccio colazione.'),v('sto bene','I am well','Grazie, sto bene.'),v('andiamo','we go','Andiamo a casa.'),v('colazione','breakfast','Faccio colazione alle otto.'),v('università','university','Vado all’università.','Universität','Unchanged in plural')],
 [fill('Noi ___ a Roma. (andare)','andiamo','Noi andiamo.'),tr('Say: I have breakfast.',['Faccio colazione','Io faccio colazione'],'Use fare colazione.'),mc('“They go” is:','vanno',['andano','vanno','vano'],'Andare has irregular vanno.'),order('Build: How are you?','Come stai','Come stai is informal singular.')],
 'La mattina faccio colazione a casa. Poi vado all’università. Anna e Luca vanno in centro. La sera stiamo a casa.',[mc('Where does the narrator have breakfast?','At home',['At home','At university','In the centre'],'A casa.'),mc('Where do Anna and Luca go?','To the centre',['To Rome','To the centre','To university'],'Vanno in centro.')],
 'Explain three parts of your day using faccio, vado and sto. Ask a partner where they go after breakfast.',
 'Write a six-line routine with andare, fare and stare. Include one noi sentence.');

topic('cafe','At the café','Order politely and understand basic café choices.',
 'Use Vorrei… (“I would like…”) as a polite fixed phrase before learning the conditional. Un caffè usually refers to an espresso in Italy. Per favore / per piacere soften a request. Quant’è? asks the total price; quanto costa? asks how much one item costs. Use Lei forms with strangers when appropriate: un caffè, per favore works without choosing a pronoun.',
 'Vorrei works like ich hätte gern. Do not say voglio for every order: it is grammatical but can sound blunt. Italian latte means milk, not the English coffee drink.',
 [['Vorrei un caffè, per favore.','I’d like a coffee, please.'],['Un cappuccino e un cornetto.','A cappuccino and a croissant.'],['Quant’è?','How much is it altogether?']],
 [v('vorrei','I would like','Vorrei un caffè.','ich hätte gern','Learn as a polite chunk'),v('per favore','please','Un tè, per favore.'),v('un caffè','an espresso / a coffee','Prendo un caffè.'),v('un cornetto','a croissant','Vorrei un cornetto.'),v('latte','milk','Il latte è caldo.','Milch','Not a coffee drink by itself'),v('quant’è?','how much is it?','Un caffè: quant’è?')],
 [tr('Say: I would like a coffee, please.','Vorrei un caffè per favore','Vorrei is a polite request.'),mc('Latte means:','Milk',['Milk','An espresso','Tea'],'In Italian, latte is milk.'),fill('Un tè, per ___.','favore','Per favore means please.'),order('Build: I’ll have a cappuccino.','Prendo un cappuccino','Prendo is natural when ordering.')],
 'Barista: Buongiorno!\nCliente: Vorrei un cappuccino e un cornetto, per favore.\nBarista: Certo. Sono quattro euro.\nCliente: Grazie.',[mc('Which drink is ordered?','Cappuccino',['Tea','Cappuccino','Water'],'Un cappuccino.'),mc('What is the total?','4 euros',['3 euros','4 euros','5 euros'],'Quattro euro.')],
 'Role-play a café order. Greet, ask for a drink and food, ask the total, and thank the server. Switch roles.',
 'Write a six-turn café dialogue; change at least two items from the example.');

topic('time','Time and your day','Tell the time and say when an activity happens.',
 'Che ore sono? asks the time. Use È l’una for one o’clock and Sono le due/tre… for other hours. “At” is all’una or alle due. E mezza = half past; e un quarto = quarter past. Mezzogiorno is noon and mezzanotte midnight. The 24-hour clock is common in schedules.',
 'Italian le due e mezza is 2:30, unlike German halb drei. Alle otto is um acht. Avoid translating German half-hours literally.',
 [['Sono le otto e mezza.','It is half past eight.'],['La lezione è alle nove.','The lesson is at nine.'],['È l’una.','It is one o’clock.']],
 [v('che ore sono?','what time is it?','Scusa, che ore sono?'),v('alle otto','at eight','Studio alle otto.'),v('e mezza','half past','Sono le nove e mezza.'),v('la mattina','in the morning','Studio la mattina.'),v('la sera','in the evening','Leggo la sera.'),v('mezzogiorno','noon','Mangio a mezzogiorno.')],
 [fill('___ le due.','Sono','Plural hours take sono.'),mc('Le otto e mezza is:','08:30',['07:30','08:30','09:30'],'It is half past eight.'),tr('Say: I study at nine.',['Studio alle nove','Io studio alle nove'],'Use alle before most hours.'),order('Build: It is one o’clock.','È l’una','One o’clock uses singular è.')],
 'La lezione è alle nove. Faccio colazione alle otto e mezza. A mezzogiorno mangio con Anna. La sera leggo.',[mc('When is breakfast?','08:30',['08:00','08:30','09:00'],'Alle otto e mezza.'),mc('When is the lesson?','09:00',['09:00','12:00','08:30'],'Alle nove.')],
 'Say three times from your actual schedule. Ask when a partner has breakfast, studies and finishes work.',
 'Write a four-event schedule with exact times, including one half-hour.');

topic('dates','Days, dates and frequency','Arrange a day and explain how often you do something.',
 'Days are lowercase: lunedì, martedì, mercoledì, giovedì, venerdì, sabato, domenica. Lunedì can mean this/next Monday; il lunedì means on Mondays in a habitual statement. Dates usually use cardinal numbers: il due novembre; the first is il primo novembre. Ogni giorno = every day; spesso = often; qualche volta = sometimes.',
 'Italian weekdays are lowercase unlike German Montag. Il lunedì is an easy way to express montags. Learn the written accent on weekdays ending in -dì.',
 [['Studio ogni giorno.','I study every day.'],['Ci vediamo lunedì.','See you on Monday.'],['Il lunedì lavoro.','I work on Mondays.']],
 [v('oggi','today','Oggi studio.'),v('domani','tomorrow','Domani lavoro.'),v('lunedì','Monday','Ci vediamo lunedì.'),v('ogni giorno','every day','Studio ogni giorno.'),v('spesso','often','Leggo spesso.'),v('qualche volta','sometimes','Qualche volta mangio fuori.')],
 [mc('“On Mondays” as a habit is:','il lunedì',['il lunedì','ieri','la lunedì'],'The article can mark habitual days.'),tr('Say: I study every day.',['Studio ogni giorno','Io studio ogni giorno'],'Ogni giorno means every day.'),fill('The first of November: il ___ novembre','primo','Dates use primo for the first.'),order('Build: Tomorrow I work.','Domani lavoro','Present tense can express scheduled future events.')],
 'Oggi è lunedì. Domani studio con Anna. Il venerdì lavoro. La domenica leggo e ascolto musica.',[mc('What day is today?','Monday',['Monday','Friday','Sunday'],'Lunedì.'),mc('When does the speaker habitually work?','Friday',['Tuesday','Friday','Sunday'],'Il venerdì lavoro.')],
 'Arrange a study meeting: offer two days, choose one and agree on a time. Say how often you study.',
 'Write a three-day plan using oggi, domani and a named weekday.');

topic('food','Order a meal','Ask for food, water and the bill in a restaurant.',
 'Learn restaurant language in complete requests: un tavolo per due, il menù, acqua naturale o frizzante, il conto. Prendo… and vorrei… are both useful. Senza means without; con means with. Use sono allergico/allergica a… only when relevant, and confirm any essential dietary detail clearly with the restaurant.',
 'Il conto is the bill; un conto can also mean an account. In this context, chiedere il conto is die Rechnung verlangen. Pasta is not the same as German Paste.',
 [['Un tavolo per due, per favore.','A table for two, please.'],['Vorrei acqua naturale.','I’d like still water.'],['Il conto, per favore.','The bill, please.']],
 [v('il menù','the menu','Posso vedere il menù?'),v('il conto','the bill','Il conto, per favore.'),v('acqua naturale','still water','Vorrei acqua naturale.'),v('acqua frizzante','sparkling water','Preferisco acqua frizzante.'),v('senza','without','Un caffè senza zucchero.'),v('un tavolo per due','a table for two','Vorrei un tavolo per due.')],
 [mc('Acqua naturale is:','Still water',['Still water','Sparkling water','Hot water'],'Naturale is still water here.'),tr('Say: The bill, please.','Il conto per favore','Il conto is the restaurant bill.'),fill('Un caffè ___ zucchero. (without)','senza','Senza means without.'),order('Build: A table for two.','Un tavolo per due','Per + number of people.')],
 'Cameriere: Acqua naturale o frizzante?\nCliente: Naturale, grazie. Prendo la pasta.\nCameriere: E per Lei?\nAnna: Una pizza, per favore.',[mc('Which water is ordered?','Still',['Still','Sparkling','Neither'],'Naturale.'),mc('What does Anna order?','Pizza',['Pasta','Pizza','Fish'],'Una pizza.')],
 'Act out arrival, ordering, one clarification and asking for the bill. Include one request with senza.',
 'Write an eight-turn restaurant exchange including a polite request and one question.');

topic('modals','Can, want, need','Combine a modal verb with an infinitive.',
 'Potere (can): posso, puoi, può, possiamo, potete, possono. Volere (want): voglio, vuoi, vuole, vogliamo, volete, vogliono. Dovere (must/need): devo, devi, deve, dobbiamo, dovete, devono. Follow the modal directly with an infinitive: posso pagare, voglio studiare, devo partire. Vorrei remains the polite request chunk.',
 'Like German können/wollen/müssen, the second verb is an infinitive, but Italian normally keeps it next to the modal rather than sending it to the end of a long clause.',
 [['Posso pagare con la carta?','Can I pay by card?'],['Voglio imparare l’italiano.','I want to learn Italian.'],['Devo studiare.','I need to study.']],
 [v('posso','I can / may','Posso entrare?'),v('puoi','you can','Puoi ripetere?'),v('voglio','I want','Voglio studiare.'),v('devo','I must / need to','Devo partire.'),v('pagare','to pay','Posso pagare?'),v('con la carta','by card','Pago con la carta.')],
 [fill('Posso ___? (to pay)','pagare','Use an infinitive after the modal.'),tr('Say: I need to study.',['Devo studiare','Io devo studiare'],'Devo + infinitive.'),mc('“We can” is:','possiamo',['potiamo','possiamo','possono'],'Irregular possiamo.'),order('Build: Can you repeat?','Puoi ripetere','Modal + infinitive.')],
 'Devo andare all’università. Voglio prendere un caffè, ma non posso: la lezione è alle nove. Posso prendere un caffè dopo.',[mc('Why can’t the speaker stop now?','There is a class at nine',['No money','There is a class at nine','The café is closed'],'La lezione è alle nove.'),mc('When can they have coffee?','Afterwards',['Before class','Afterwards','Never'],'Dopo.')],
 'Make one request, say two things you want to do and one thing you must do today. Ask a partner what they can do this weekend.',
 'Write six sentences: two with potere, two with volere, two with dovere.');

topic('shopping','At the shops','Ask prices and quantities and request a size.',
 'Quanto costa? asks the price of one thing; quanto costano? asks about multiple things. Vorrei un chilo di mele gives a quantity with di. Questo/questa/questi/queste means this/these and agrees with the noun. Posso provare…? is useful for clothes.',
 'Quanto costa/costano agrees with the item, like was kostet/kosten. Un chilo di… corresponds to ein Kilo…, with an explicit di in Italian.',
 [['Quanto costano queste mele?','How much are these apples?'],['Vorrei un chilo di mele.','I’d like a kilo of apples.'],['Posso provare questa giacca?','Can I try on this jacket?']],
 [v('quanto costa?','how much does it cost?','Quanto costa questa giacca?'),v('un chilo di','a kilo of','Vorrei un chilo di mele.'),v('mele','apples','Le mele sono buone.'),v('questa','this (feminine)','Questa giacca è bella.'),v('taglia','clothing size','Avete una taglia più grande?'),v('troppo caro','too expensive','Questo libro è troppo caro.')],
 [fill('Quanto ___ queste mele?','costano','Plural item → costano.'),fill('Un chilo ___ mele.','di','Quantity + di + noun.'),tr('Say: this jacket','questa giacca','Giacca is feminine singular.'),order('Build: Can I pay by card?','Posso pagare con la carta','Modal + infinitive + payment method.')],
 'Cliente: Vorrei un chilo di mele. Quanto costano?\nVenditore: Due euro al chilo.\nCliente: Bene. Posso pagare con la carta?\nVenditore: Certo.',[mc('What quantity is wanted?','One kilo',['Half a kilo','One kilo','Two kilos'],'Un chilo.'),mc('What is the price per kilo?','2 euros',['2 euros','3 euros','4 euros'],'Due euro al chilo.')],
 'Buy two grocery items, ask their prices, request a quantity and ask to pay by card.',
 'Write a grocery exchange; then change it into a clothes-shopping exchange using taglia and provare.');

topic('possessives','Your people','Describe family and use basic possessives.',
 'Mio, tuo, suo, nostro, vostro, loro agree with the thing possessed, not the owner. Usually include an article: il mio libro, la mia casa. Singular unmodified family terms commonly omit it: mia madre, mio padre. Plurals take it: i miei fratelli. Loro takes an article: la loro madre. Suo can mean his, her or formal your; context matters.',
 'Italian possessives follow the noun’s gender, like mein/meine in German. Suo does not tell you whether the owner is male or female, unlike English his/her.',
 [['Mia madre è in Germania.','My mother is in Germany.'],['La mia casa è piccola.','My house is small.'],['I miei amici sono qui.','My friends are here.']],
 [v('mia madre','my mother','Mia madre è tedesca.'),v('mio padre','my father','Mio padre è a casa.'),v('fratello','brother','Ho un fratello.'),v('sorella','sister','Mia sorella studia.'),v('i miei amici','my friends','I miei amici sono qui.'),v('la mia','my (feminine singular)','La mia casa è grande.')],
 [fill('La ___ casa. (my)','mia','Possessive agrees with feminine casa.'),mc('My mother is normally:','mia madre',['la mio madre','mia madre','il mia madre'],'Singular unmodified family noun usually omits article.'),tr('Say: my friends (male/mixed)','i miei amici','Masculine plural: i miei.'),order('Build: My father is at home.','Mio padre è a casa','No article before singular padre here.')],
 'Mia madre è in Germania. Mio padre lavora a casa. Mia sorella studia inglese. I miei amici abitano a Londra.',[mc('Who studies English?','The sister',['The mother','The sister','The friends'],'Mia sorella.'),mc('Where do the friends live?','London',['London','Rome','Berlin'],'A Londra.')],
 'Describe two real or imaginary family members and a friend. Say where they live and what they do.',
 'Write a five-sentence family profile. Check every possessive ending.');

topic('reflexive','A day in your life','Describe a routine with reflexive verbs.',
 'Reflexive pronouns: mi, ti, si, ci, vi, si. They go before the conjugated verb: mi sveglio, ti alzi, si lava. We use the familiar calling-yourself pattern in mi chiamo. With a modal, either mi devo alzare or devo alzarmi is possible. Focus first on the simple present.',
 'Compare ich wasche mich / du wäschst dich. Italian pronouns normally precede the finite verb; German often places them after it. Not every routine verb is reflexive.',
 [['Mi sveglio alle otto.','I wake up at eight.'],['Mi alzo e faccio colazione.','I get up and have breakfast.'],['Ci vediamo domani.','See you tomorrow.']],
 [v('mi sveglio','I wake up','Mi sveglio alle otto.'),v('mi alzo','I get up','Mi alzo presto.'),v('mi lavo','I wash myself','Mi lavo la mattina.'),v('mi vesto','I get dressed','Mi vesto dopo colazione.'),v('presto','early / soon','Mi alzo presto.'),v('tardi','late','Vado a letto tardi.')],
 [fill('Io ___ sveglio alle otto.','mi','Io takes mi.'),fill('Noi ___ alziamo presto.','ci','Noi takes ci.'),tr('Say: I get up early.',['Mi alzo presto','Io mi alzo presto'],'Mi before alzo.'),order('Build: See you tomorrow.','Ci vediamo domani','A reciprocal expression used as a farewell.')],
 'Mi sveglio alle sette, ma mi alzo alle sette e mezza. Mi lavo, mi vesto e faccio colazione. Alle otto vado all’università.',[mc('When does the narrator get up?','07:30',['07:00','07:30','08:00'],'Mi alzo alle sette e mezza.'),mc('Where do they go at eight?','University',['Home','University','The café'],'All’università.')],
 'Describe your first hour after waking. Use at least three reflexive verbs and two times.',
 'Write the same morning routine once with io and once with noi.');

topic('place','Find your way','Ask for a place and understand basic directions.',
 'C’è = there is; ci sono = there are. Ask Dov’è…? for a known place. Basic direction chunks: a destra, a sinistra, sempre dritto. Vicino a = near; davanti a = in front of; dietro = behind. Imperative chunks such as vai dritto are useful now; learn the full system later.',
 'C’è / ci sono distinguish singular and plural unlike German es gibt. Destra and sinistra are right and left; do not infer direction from a familiar English word.',
 [['Dov’è la stazione?','Where is the station?'],['C’è un supermercato qui vicino?','Is there a supermarket nearby?'],['Vai dritto, poi a destra.','Go straight, then right.']],
 [v('c’è','there is','C’è un bar.'),v('ci sono','there are','Ci sono due bar.'),v('a destra','to the right','Gira a destra.'),v('a sinistra','to the left','Gira a sinistra.'),v('dritto','straight ahead','Vai dritto.'),v('la stazione','the station','Dov’è la stazione?')],
 [fill('___ due bar.','Ci sono','Plural: ci sono.'),tr('Say: Where is the station?','Dov’è la stazione','Dove + è becomes dov’è.'),mc('A sinistra means:','To the left',['To the right','To the left','Straight ahead'],'Sinistra is left.'),order('Build: There is a café.','C’è un bar','Singular: c’è.')],
 'Turista: Dov’è la stazione?\nAnna: Vai sempre dritto, poi a sinistra. La stazione è vicino al supermercato.\nTurista: Grazie!',[mc('Which turn should the tourist make?','Left',['Left','Right','No turn'],'A sinistra.'),mc('What is near the station?','A supermarket',['A university','A supermarket','A hotel'],'Vicino al supermercato.')],
 'Give directions from an imaginary café to a station. Ask for repetition once; confirm the final direction.',
 'Write directions with three steps and one landmark. Sketch a simple route on paper to check consistency.');

topic('prepositions','Make connections','Use common articulated prepositions in everyday phrases.',
 'Some prepositions combine with articles: a + il = al; a + la = alla; di + il = del; in + il = nel; da + il = dal; su + il = sul. Before a vowel: all’università, dell’amica. Learn useful phrases rather than trying to memorise the entire table at once. Per and con usually remain separate in this beginner pathway.',
 'Like German am (an dem), Italian forms common contractions, but the combinations and uses differ. Nel is in + il, not a past tense.',
 [['Vado al supermercato.','I go to the supermarket.'],['Il libro è sul tavolo.','The book is on the table.'],['Sono alla stazione.','I am at the station.']],
 [v('al supermercato','at / to the supermarket','Vado al supermercato.'),v('alla stazione','at / to the station','Sono alla stazione.'),v('sul tavolo','on the table','Il libro è sul tavolo.'),v('nel','in the (masculine singular)','Il libro è nel cassetto.'),v('della','of the (feminine singular)','La porta della casa è aperta.'),v('dal','from / at the (masculine singular)','Vengo dal supermercato.')],
 [fill('a + il = ___','al','A and il contract to al.'),fill('Il libro è ___ tavolo. (on the)','sul','Su + il = sul.'),tr('Say: I go to the supermarket.',['Vado al supermercato','Io vado al supermercato'],'A + il = al.'),mc('In + il gives:','nel',['nel','nello','al'],'Nel combines in and il.')],
 'Vado al supermercato. Anna è alla stazione. Il suo libro è sul tavolo, vicino alla porta.',[mc('Where is Anna?','At the station',['At the station','At university','At the supermarket'],'Alla stazione.'),mc('Where is the book?','On the table',['Under a chair','On the table','In a bag'],'Sul tavolo.')],
 'Describe where three things are. Then say where you are going and where a friend is waiting.',
 'Write six sentences using al, alla, nel, della, sul and all’università.');

topic('likes','What you like','Use mi piace and mi piacciono accurately.',
 'With piacere, the thing liked is the grammatical subject. Mi piace il caffè (singular); mi piacciono i libri (plural); mi piace leggere (infinitive). Non mi piace expresses dislike. Preferisco… is easier when directly comparing choices. Use perché to give one reason.',
 'Think of German mir gefällt / mir gefallen: mi piace il libro, mi piacciono i libri. This is much closer than the English “I like” construction.',
 [['Mi piace leggere.','I like reading.'],['Mi piacciono i libri.','I like books.'],['Preferisco il tè al caffè.','I prefer tea to coffee.']],
 [v('mi piace','I like (singular / infinitive)','Mi piace il caffè.','mir gefällt'),v('mi piacciono','I like (plural)','Mi piacciono i libri.','mir gefallen'),v('leggere','to read','Mi piace leggere.'),v('musica','music','Ascolto musica.'),v('anche','also / too','Anche a me piace.'),v('invece','instead / whereas','Io invece preferisco il tè.')],
 [fill('Mi ___ i libri.','piacciono','I libri is plural.'),fill('Mi ___ leggere.','piace','An infinitive acts as singular subject.'),tr('Say: I don’t like coffee.','Non mi piace il caffè','Non before mi piace.'),order('Build: I like books.','Mi piacciono i libri','Plural verb agrees with libri.')],
 'Mi piace leggere e ascoltare musica. Non mi piace correre. Anna invece ama correre. A tutti e due piace il caffè.',[mc('What does the narrator dislike?','Running',['Reading','Music','Running'],'Non mi piace correre.'),mc('What do both like?','Coffee',['Running','Coffee','Tea'],'A tutti e due piace il caffè.')],
 'Give three likes and one dislike. Ask a partner Ti piace…? and respond with a short reason.',
 'Write two singular likes, two plural likes and one liked activity.');

topic('exchange','Keep a conversation going','Ask for clarification and repair a misunderstanding.',
 'Useful repair phrases: Puoi parlare più lentamente?; Non ho capito; Come si dice… in italiano?; Che cosa significa…? Non ho capito is a useful past-tense chunk before the full tense lesson. Ask one question at a time and reuse what you know. You do not need flawless grammar to negotiate meaning.',
 'Non ho capito corresponds to ich habe nicht verstanden. Saying it clearly is communicative success: it invites a useful repetition rather than hiding confusion.',
 [['Puoi parlare più lentamente?','Can you speak more slowly?'],['Che cosa significa “conto”?','What does “conto” mean?'],['Come si dice “book” in italiano?','How do you say “book” in Italian?']],
 [v('non ho capito','I didn’t understand','Scusa, non ho capito.'),v('più lentamente','more slowly','Puoi parlare più lentamente?'),v('che cosa significa?','what does it mean?','Che cosa significa “conto”?'),v('come si dice?','how do you say?','Come si dice “house” in italiano?'),v('ancora una volta','one more time','Puoi ripetere ancora una volta?'),v('un momento','one moment','Un momento, per favore.')],
 [tr('Say: I didn’t understand.',['Non ho capito','Io non ho capito'],'A useful fixed chunk with passato prossimo.'),mc('To ask for slower speech:', 'Puoi parlare più lentamente?',['Quanto costa?','Puoi parlare più lentamente?','Di dove sei?'],'Lentamente means slowly.'),fill('Come si ___ “book” in italiano?','dice','Come si dice asks how to say something.'),order('Build: One moment, please.','Un momento per favore','A natural request for thinking time.')],
 'Anna: Che cosa fai nel tempo libero?\nJannik: Scusa, non ho capito. Puoi ripetere più lentamente?\nAnna: Nel tempo libero, leggi?\nJannik: Sì, mi piace leggere.',[mc('What does Jannik request?','A slower repetition',['A translation of a menu','A slower repetition','A coffee'],'Ripetere più lentamente.'),mc('Which hobby emerges?','Reading',['Reading','Running','Swimming'],'Mi piace leggere.')],
 'Have a five-minute exchange or rehearsal. Introduce yourself, ask three questions, and deliberately use one clarification phrase. Note one sentence you could not yet say.',
 'Write a partner introduction in Italian and state that you can help with German or English. Do not send it automatically.','exchange');

topic('past_avere','Talk about yesterday','Build passato prossimo with avere and regular participles.',
 'Passato prossimo often describes completed past events. Use present avere + past participle: ho parlato, hai mangiato, abbiamo dormito. Regular participles: -are → -ato, -ere → -uto, -ire → -ito, but many common -ere verbs are irregular. With avere and a normal noun object, the participle does not agree with the subject: Anna ha mangiato. Learn common irregulars separately.',
 'This resembles German Perfekt: ich habe gegessen / ho mangiato. Italian uses it frequently in conversation; usage is not a one-to-one match with English present perfect.',
 [['Ieri ho studiato italiano.','Yesterday I studied Italian.'],['Abbiamo mangiato una pizza.','We ate a pizza.'],['Hai dormito bene?','Did you sleep well?']],
 [v('ieri','yesterday','Ieri ho studiato.'),v('ho studiato','I studied / have studied','Ho studiato italiano.'),v('ho mangiato','I ate / have eaten','Ho mangiato una pizza.'),v('ho dormito','I slept / have slept','Ho dormito bene.'),v('abbiamo parlato','we spoke','Abbiamo parlato italiano.'),v('dopo','after / afterwards','Dopo ho lavorato.')],
 [fill('Ieri ho ___ italiano. (studiare)','studiato','Studiare → studiato.'),fill('Noi ___ mangiato.','abbiamo','Use present avere with the noi subject.'),tr('Say: I slept well.',['Ho dormito bene','Io ho dormito bene'],'Avere + dormito.'),order('Build: Yesterday I studied Italian.','Ieri ho studiato italiano','Time + auxiliary + participle + object.')],
 'Ieri ho studiato italiano per mezz’ora. Poi ho mangiato con Anna. La sera abbiamo parlato in italiano e ho dormito bene.',[mc('How long did the narrator study?','Half an hour',['Ten minutes','Half an hour','Two hours'],'Per mezz’ora.'),mc('Who ate with the narrator?','Anna',['Anna','Luca','Nobody'],'Con Anna.')],
 'Describe yesterday in four completed actions. Ask a partner two questions with Hai…?',
 'Write six past-tense sentences with avere; underline each auxiliary and participle.');

topic('past_essere','Where you went','Use essere in the past with agreement.',
 'Some verbs take essere: sono andato/andata, sono arrivato/arrivata, sono partito/partita. With essere, the participle agrees with the subject: Anna è arrivata; Anna e Giulia sono arrivate; a male or mixed group is arrivati. Reflexive verbs also take essere: mi sono alzato/alzata. “Movement verb” is not a complete rule: camminare uses avere. Learn each verb’s auxiliary.',
 'German can help with sein verbs (ich bin gegangen), but the lists are not identical. Italian participles agree with essere; German participles do not change for gender or number.',
 [['Sono andato a Roma.','I went to Rome. (male speaker)'],['Anna è arrivata ieri.','Anna arrived yesterday.'],['Ci siamo alzati presto.','We got up early. (male/mixed group)']],
 [v('sono andato','I went (male speaker)','Sono andato a Roma.','ich bin gegangen','Female: sono andata'),v('è arrivata','she arrived','Anna è arrivata ieri.'),v('siamo partiti','we left (male/mixed)','Siamo partiti alle otto.'),v('mi sono alzato','I got up (male)','Mi sono alzato presto.','ich bin aufgestanden','Female: alzata'),v('viaggio','journey / trip','Il viaggio è stato bello.'),v('tornare','to return','Sono tornato a casa.')],
 [fill('Anna è ___ ieri. (arrivare)','arrivata','Essere requires feminine singular agreement.'),fill('Noi ___ partiti.','siamo','Partire takes essere.'),tr('Say: I went to Rome. (male)',['Sono andato a Roma','Io sono andato a Roma'],'Essere + andato.'),mc('“Anna e Giulia sono…”','arrivate',['arrivato','arrivati','arrivate'],'All-female plural: arrivate.')],
 'Anna è partita ieri. È andata a Roma in treno. È arrivata alle dieci. Luca è arrivato più tardi.',[mc('Where did Anna go?','Rome',['Milan','Rome','London'],'È andata a Roma.'),mc('Who arrived later?','Luca',['Anna','Luca','Both together'],'Luca è arrivato più tardi.')],
 'Tell someone where you went recently. Say when you left, arrived and returned. Check the participle endings for your own gender.',
 'Write about Anna’s journey, then rewrite about Anna and Giulia together.');

topic('past_irregular','What happened','Use common irregular past participles.',
 'High-frequency irregular participles: fare → fatto; vedere → visto; prendere → preso; leggere → letto; scrivere → scritto; dire → detto; essere/stare → stato. Use phrases: ho fatto colazione, ho visto un film, ho preso il treno. Essere itself takes essere: sono stato/stata a Roma.',
 'As with German gemacht/gesehen/genommen, frequent participles need separate learning. Do not derive every -ere participle mechanically.',
 [['Ho visto un film.','I watched a film.'],['Ho preso il treno.','I took the train.'],['Ho scritto un messaggio.','I wrote a message.']],
 [v('ho fatto','I did / made','Ho fatto colazione.'),v('ho visto','I saw','Ho visto un film.'),v('ho preso','I took','Ho preso il treno.'),v('ho letto','I read (past)','Ho letto un libro.'),v('ho scritto','I wrote','Ho scritto un messaggio.'),v('ho detto','I said','Ho detto grazie.')],
 [fill('Ho ___ il treno. (prendere)','preso','Prendere → preso.'),fill('Ho ___ un libro. (leggere)','letto','Leggere → letto.'),tr('Say: I watched a film.',['Ho visto un film','Io ho visto un film'],'Vedere → visto.'),order('Build: I wrote a message.','Ho scritto un messaggio','Scrivere → scritto.')],
 'Sabato ho preso il treno per Milano. Ho visto un amico e abbiamo fatto una passeggiata. La sera ho scritto un messaggio ad Anna.',[mc('Where did the narrator go?','Milan',['Rome','Milan','Florence'],'Per Milano.'),mc('What did they do with a friend?','Went for a walk',['Watched a film','Went for a walk','Read a book'],'Abbiamo fatto una passeggiata.')],
 'Retell a recent day using at least three irregular participles. Ask a follow-up question about a partner’s day.',
 'Write a 60-word account of yesterday. Circle irregular participles.');

topic('travel','On the move','Buy a ticket and ask about departure and arrival.',
 'Useful travel chunks: un biglietto per…, solo andata, andata e ritorno, a che ora parte?, da quale binario? Partire = depart; arrivare = arrive. Per introduces a destination in a ticket request. A schedule question can use the present even for a future departure.',
 'Binario is a railway platform track, like Gleis. Un biglietto can be a ticket or note; “ticket” in English maps to different Italian words by context.',
 [['Un biglietto per Roma, per favore.','A ticket to Rome, please.'],['A che ora parte il treno?','What time does the train leave?'],['Da quale binario?','From which platform/track?']],
 [v('un biglietto','a ticket','Vorrei un biglietto per Roma.'),v('andata e ritorno','return / round trip','Un biglietto andata e ritorno.'),v('solo andata','one way','Solo andata, per favore.'),v('il binario','the platform track','Il treno parte dal binario due.','Gleis'),v('parte','it departs','Il treno parte alle nove.'),v('arriva','it arrives','Il treno arriva alle dieci.')],
 [mc('Andata e ritorno is:','A return ticket',['One way','A return ticket','A reservation'],'Outward and return journeys.'),fill('Da quale ___? (platform track)','binario','Binario identifies the track.'),tr('Say: A ticket to Rome, please.','Un biglietto per Roma per favore','Per + destination.'),order('Build: What time does the train leave?','A che ora parte il treno','A che ora asks at what time.')],
 'Il treno per Roma parte alle nove dal binario tre. Arriva alle undici. Il biglietto costa venti euro.',[mc('Which platform track?','3',['2','3','9'],'Binario tre.'),mc('When does it arrive?','11:00',['09:00','10:00','11:00'],'Alle undici.')],
 'Buy a ticket, ask departure time and platform, and confirm the answer aloud. Repeat with a return ticket.',
 'Write a travel information card with origin, destination, departure, arrival and price.');

topic('hotel','A place to stay','Check into a hotel and explain a simple problem.',
 'Use ho una prenotazione a nome… to check in. Una camera singola/doppia, per due notti, la colazione è inclusa? are practical chunks. Non funziona describes something that does not work. C’è un problema con… introduces a problem without needing complex grammar.',
 'Camera means room in a hotel, not a photographic camera (macchina fotografica). Prenotazione is a reservation, similar in purpose to Buchung.',
 [['Ho una prenotazione a nome Otte.','I have a reservation under Otte.'],['La colazione è inclusa?','Is breakfast included?'],['Il Wi-Fi non funziona.','The Wi-Fi does not work.']],
 [v('una prenotazione','a reservation','Ho una prenotazione.'),v('una camera','a room','Vorrei una camera doppia.','ein Zimmer','Not a camera for photos'),v('per due notti','for two nights','Resto per due notti.'),v('la chiave','the key','Dov’è la chiave?'),v('non funziona','it does not work','Il Wi-Fi non funziona.'),v('inclusa','included (feminine)','La colazione è inclusa.')],
 [fill('Ho una ___ a nome Otte.','prenotazione','A reservation: prenotazione.'),mc('Una camera is:','A room',['A room','A photo camera','A ticket'],'Camera = room.'),tr('Say: The Wi-Fi does not work.','Il Wi-Fi non funziona','Non before funziona.'),order('Build: Is breakfast included?','La colazione è inclusa','Inclusa agrees with colazione.')],
 'Cliente: Ho una prenotazione a nome Otte, per due notti.\nReceptionist: Una camera singola?\nCliente: Sì. La colazione è inclusa?\nReceptionist: Sì, dalle sette alle dieci.',[mc('How many nights?','Two',['One','Two','Three'],'Due notti.'),mc('When does breakfast end?','10:00',['07:00','09:00','10:00'],'Alle dieci.')],
 'Check in, confirm two details, ask about breakfast and report one simple problem with the room.',
 'Write a hotel message with your arrival time and one polite request.');

topic('plans','Make a plan','Discuss future intentions using the present and time expressions.',
 'Italian often uses the present with a future time: domani vado…, sabato partiamo…. Vorrei + infinitive expresses a wish. Ho intenzione di + infinitive expresses an intention. The simple future is useful later, but you can communicate many near-term plans now without introducing a whole new tense.',
 'This resembles German Morgen fahre ich…: the time word supplies the future meaning. Avoid translating English going to word-for-word as a universal future marker.',
 [['Domani vado a Roma.','Tomorrow I’m going to Rome.'],['Sabato vorrei vedere un film.','On Saturday I’d like to see a film.'],['Vuoi venire con me?','Do you want to come with me?']],
 [v('il fine settimana','the weekend','Il fine settimana studio.'),v('la prossima settimana','next week','Parto la prossima settimana.'),v('ho intenzione di','I intend to','Ho intenzione di studiare.'),v('venire','to come','Vuoi venire con me?'),v('volentieri','gladly / I’d love to','Sì, volentieri!'),v('purtroppo','unfortunately','Purtroppo non posso.')],
 [tr('Say: Tomorrow I’m going to Rome.',['Domani vado a Roma','Vado a Roma domani'],'Present + future time expression.'),fill('Ho intenzione ___ studiare.','di','The phrase takes di.'),mc('A friendly acceptance is:','Volentieri!',['Purtroppo!','Volentieri!','Non funziona!'],'Volentieri expresses willingness.'),order('Build: Do you want to come with me?','Vuoi venire con me','Modal + infinitive.')],
 'Sabato vorrei andare al cinema. Anna non può, ma Luca viene volentieri. Ci vediamo alle sette davanti al cinema.',[mc('Who will join the speaker?','Luca',['Anna','Luca','Both'],'Luca viene volentieri.'),mc('Where will they meet?','In front of the cinema',['At home','In front of the cinema','At the station'],'Davanti al cinema.')],
 'Invite a partner to an activity. Negotiate a day, time and place. Decline one suggestion politely and offer another.',
 'Write a weekend invitation and two possible replies: an acceptance and a polite refusal.');

topic('objects','Avoid repeating yourself','Use direct object pronouns in simple present sentences.',
 'Direct objects can be replaced by lo (masculine singular), la (feminine singular), li (masculine plural), le (feminine plural). Put them before the conjugated verb: il libro? Lo leggo. Le mele? Le compro. With an infinitive, they may attach to it: voglio comprarlo; lo voglio comprare is also possible. Start with the present; past-tense pronoun agreement comes later.',
 'Like ihn/sie/es, the pronoun replaces an object. Italian normally places an unstressed object pronoun before the finite verb, unlike many German sentences.',
 [['Il libro? Lo leggo.','The book? I’m reading it.'],['Le mele? Le compro.','The apples? I’m buying them.'],['Voglio comprarlo.','I want to buy it. (masculine)']],
 [v('lo','it / him (direct object)','Il libro? Lo leggo.'),v('la','it / her (direct object)','La pizza? La mangio.'),v('li','them (masculine direct object)','I libri? Li leggo.'),v('le','them (feminine direct object)','Le mele? Le compro.'),v('comprare','to buy','Voglio comprare un libro.'),v('vedere','to see','Voglio vedere Roma.')],
 [fill('Il libro? ___ leggo.','Lo','Libro is masculine singular.'),fill('Le mele? ___ compro.','Le','Mele is feminine plural.'),tr('Say: I’m reading them. (the books)',['Li leggo','Io li leggo'],'Li refers to masculine plural libri.'),order('Build: I want to buy it. (masculine, attached pronoun)','Voglio comprarlo','Drop infinitive final e and attach lo.')],
 'Anna: Compri le mele?\nLuca: Sì, le compro oggi.\nAnna: E il pane?\nLuca: Lo compro domani.',[mc('What will Luca buy today?','Apples',['Bread','Apples','Books'],'Le mele: le compro oggi.'),mc('When will he buy bread?','Tomorrow',['Today','Tomorrow','Yesterday'],'Lo compro domani.')],
 'Point to four objects and say whether you buy, eat or read them. Replace each noun with lo, la, li or le.',
 'Write four noun-based sentences, then rewrite them with direct object pronouns.');

topic('opinions','Say what you think','Give an opinion and connect it to a reason or contrast.',
 'Secondo me = in my opinion. Penso che often leads to grammar beyond this foundation, so start with secondo me + a normal statement. Perché gives a reason, ma a contrast, quindi a result. Mi sembra… (“it seems to me…”) is useful with an adjective. Keep ideas short and connected.',
 'Secondo me works like meiner Meinung nach. Però is however/but, not German pro. Eventualmente means possibly/if necessary, not English eventually.',
 [['Secondo me, il film è interessante.','In my opinion, the film is interesting.'],['Studio perché voglio parlare italiano.','I study because I want to speak Italian.'],['È caro, quindi non lo compro.','It is expensive, so I won’t buy it.']],
 [v('secondo me','in my opinion','Secondo me, è interessante.'),v('ma','but','È bello, ma caro.'),v('quindi','so / therefore','Ho fame, quindi mangio.'),v('però','however / but','È utile, però è difficile.'),v('facile','easy','La domanda è facile.'),v('difficile','difficult','La lezione è difficile.')],

 const day=i+1,week=Math.ceil(day/7),phase=day<=14?1:day<=42?2:day<=70?3:4;
 const checkpoint=CHECKPOINT_IDS.has(day);
 const previous=DAY_SPECS.slice(Math.max(0,i-6),i).filter(x=>x[0]!=='checkpoint').map(x=>x[0]);
 const cumulative=[...new Set(DAY_SPECS.slice(0,i).filter(x=>x[0]!=='checkpoint').map(x=>x[0]))];
 let quiz=[];
 if(checkpoint){
  const finalTopics=['essere','numbers','articles','plurals','avere','are','ere_ire','questions','agreement','time','food','modals','reflexive','prepositions','likes','past_avere','past_essere','past_irregular','travel','hotel','plans','objects','opinions','story'];
  const pool=day===90?finalTopics:[...new Set([...previous,...cumulative.slice(0,Math.min(4,cumulative.length))])];
  const size=day===90?24:10;
  for(let n=0;n<size;n++){const tid=pool[n%pool.length];const t=TOPICS[tid];const qi=(Math.floor(n/pool.length)+week)%t.questions.length;quiz.push({...t.questions[qi],topic:tid,id:`d${day}q${n}`});}
 }else{
  quiz=TOPICS[id].questions.map((x,j)=>({...x,topic:id,id:`d${day}q${j}`}));
  if(day>14){const prior=cumulative.filter(x=>x!==id);if(prior.length){const tid=prior[day%prior.length];quiz.push({...TOPICS[tid].questions[day%TOPICS[tid].questions.length],topic:tid,id:`d${day}mix`});}}
 }
 const tid=checkpoint?(previous.at(-1)||'hello'):id;
 return {day,id,title,goal,week,phase,checkpoint,topic:tid,quiz,

 if(tab==='learn')main=`<div class="eyebrow">${l.checkpoint?'Consolidation & retrieval':'Today’s learning objective'}</div><h2>${esc(l.goal)}</h2><p>${esc(l.structured)}</p>${l.checkpoint?`<div class="note mb">Take the quiz before looking up rules. Your first-attempt score is preserved. Retakes help learning, but do not erase earlier errors.</div><div class="tag-list">${[...new Set(l.quiz.map(q=>q.topic))].map(id=>button(TOPICS[id].title,'topic',`data-topic="${id}"`,'secondary small')).join('')}</div>`:`<h3>${esc(t.title)}</h3><p>${esc(t.explain)}</p>${state.settings.explanations==='connections'?`<div class="note"><strong>A bridge from German & English</strong><p>${esc(t.de)}</p></div>`:''}<div class="examples">${t.examples.map(([it,en])=>`<div class="example"><div class="row between"><strong lang="it">${esc(it)}</strong>${button(icon('sound'),'speak',`data-text="${esc(it)}" aria-label="Hear ${esc(it)}"`,'ghost small')}</div><span>${esc(en)}</span></div>`).join('')}</div>`}${resourceAssignment(l)}<div class="screen-action">${button(p?.checks.includes('learn')?'Learning activity marked ✓':'Mark structured activity done','mark',`data-part="learn" data-day="${day}"`,'secondary')}${link('Try the exercises '+icon('arrow'),`lesson/${day}/quiz`,'ghost')}</div>`;
 if(tab==='quiz')main=quizView(l);
 if(tab==='vocab')main=`<h2>Recall before you reveal.</h2><p>${esc(l.vocabulary)}</p>${vocabTrainer(day)}<h3 class="mt">Words for this lesson</h3>${vocabMini(t.vocab)}<div class="screen-action">${button(p?.checks.includes('vocab')?'Recall activity marked ✓':'Mark recall practice done','mark',`data-part="vocab" data-day="${day}"`,'secondary')}${link('Continue to listening →',`lesson/${day}/listen`,'ghost')}</div>`;
 if(tab==='listen')main=listening(l)+`<div class="screen-action">${button(p?.checks.includes('listen')?'Listening activity marked ✓':'Mark listening / reading task done','mark',`data-part="listen" data-day="${day}"`,'secondary')}${link('Use what you learned →',`lesson/${day}/output`,'ghost')}</div>`;
 if(tab==='output')main=output(l)+`<div class="screen-action">${button(p?.checks.includes('output')?'Output activity marked ✓':'Mark speaking / writing task done','mark',`data-part="output" data-day="${day}"`,'secondary')}${link('Review your lesson →',`lesson/${day}/finish`,'ghost')}</div>`;
