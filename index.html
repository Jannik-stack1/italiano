 return heading(`Phase ${l.phase} · ${PHASES[l.phase-1]}`,`${dayTitle(day)} · ${esc(l.title)}`,l.checkpoint?'Check what you can retrieve and communicate. Completion is not a certification.':t.objective,button(icon('clock')+' Focus timer','timer-start',`data-skill="${tab==='listen'?'listening':tab==='output'?'speaking':tab==='vocab'?'vocabulary':'grammar'}" data-day="${day}"`,'secondary'))+(day>E.currentDay(state)?'<div class="note warning">You’re previewing ahead. You can explore and practise, but complete earlier days before marking this lesson finished.</div>':'')+`<nav class="tabs" aria-label="Lesson sections">${tabs.map(([id,title])=>`<a class="tab" href="#lesson/${day}/${id}" aria-current="${id===tab?'page':'false'}" style="text-decoration:none">${title}</a>`).join('')}</nav><div class="lesson-layout"><article class="lesson-copy">${main}</article><aside class="lesson-aside"><div class="card"><div class="eyebrow">Your session</div><h3>${E.allocation(state).total} minutes, four kinds of practice</h3>${activityRows(day)}<p class="small muted mt">Time is counted only when you save a focus timer or manual log. Activity checks never invent minutes.</p>${button('Log focused time','log',`data-day="${day}"`,'secondary small')}${button('Voice settings','voice-settings','','ghost small')}<div class="mt">${button('Practise with ChatGPT','tutor',`data-day="${day}"`,'ghost small')}</div></div>${l.checkpoint?'<div class="note mt">This checkpoint interleaves earlier topics. Repeat weak areas before moving on. Speaking and writing use explicit self-ratings.</div>':''}</aside></div>`;
 }
 function resourceAssignment(l){const primary=RESOURCES.find(r=>r.id===l.external)||RESOURCES[1];return `<details class="card card-tight mt"><summary><strong class="small">Optional companion resources</strong></summary><p class="small muted">${primary.id==='lt'?`Suggested sequence slot: track ${l.ltTracks?.join('–')||state.lab.ltTrack}. Keep your own next-track bookmark; skip no questions. Listen, pause at every prompt, speak an answer, compare, and replay difficult sections. This track sequence is not a claim about specific track contents.`:esc(primary.how)}</p><div class="row">${external(primary)}${primary.id!=='oic'?external(RESOURCES[1],'Open A1 topic index'):''}</div><p class="small muted mt">Online Italian Club pathway topic: <strong>${esc(l.oicTopic)}</strong>. Use A1 unless your readiness evidence supports A2. Exact deep links and current availability could not be verified; use the named topic in the provider’s index. The original lesson above is always available.</p><span class="pill warn">Live access unverified · ${VERIFIED_ON}</span></details>`;}
 function questionHTML(q,day,index){const result=E.latestAttempt(state,day)?.answers[q.id],tokens=q.type==='order'?q.answers[0].split(' ').map((w,i)=>({w,i})).sort((a,b)=>((a.i*7+3)%11)-((b.i*7+3)%11)):[],built=wordOrders[q.id]||[];return `<section class="question" id="question-${q.id}"><div class="question-number">${index+1} / ${LESSONS[day-1].quiz.length} · ${q.type==='choice'?'Choose one':q.type==='order'?'Build a sentence':q.type==='fill'?'Fill the gap':'Produce an answer'}</div><h3>${esc(q.prompt)}</h3>${result?`<div class="small muted">Your answer: <strong>${esc(result.value)}</strong></div><div class="feedback ${result.correct?'':'incorrect'}"><strong>${result.correct?'Correct.':'Not quite. '+esc(q.answers[0])}</strong><p>${esc(q.why)}</p></div>`:q.type==='choice'?`<div class="answers">${q.choices.map(c=>`<button class="choice" data-action="answer" data-day="${day}" data-qid="${q.id}" data-value="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:q.type==='order'?`<div class="assembled" aria-live="polite">${built.length?built.map(i=>`${esc(q.answers[0].split(' ')[i])}`).join(' '):'<span class="muted small">Tap words in order, then check.</span>'}</div><div class="tokens">${tokens.map(({w,i})=>`<button class="token" data-action="token" data-qid="${q.id}" data-index="${i}" ${built.includes(i)?'disabled':''}>${esc(w)}</button>`).join('')}</div><div class="row">${button('Check order','order-check',`data-qid="${q.id}" data-day="${day}"`,'small')}${button('Undo','order-undo',`data-qid="${q.id}"`,'secondary small')}${button('Clear','order-clear',`data-qid="${q.id}"`,'ghost small')}</div>`:`<form data-form="answer" data-day="${day}" data-qid="${q.id}"><label class="sr-only" for="answer-${q.id}">${esc(q.prompt)}</label><div class="input-row"><input id="answer-${q.id}" name="answer" autocomplete="off" autocapitalize="sentences" spellcheck="false" required placeholder="Try from memory…"><button class="button" type="submit">Check answer</button></div></form><div class="small muted" style="margin-top:8px">Accents and apostrophes matter. Casing and sentence punctuation do not.</div>`}</section>`;}
 function quizView(l){const r=E.quizResult(state,l.day),attempts=state.lessons[l.day]?.attempts.length||0;return `<div class="row between"><div><h2>Make it your own.</h2><p class="small muted">Attempt ${Math.max(1,attempts)} · ${r.answered}/${r.total} answered · ${r.percent===null?'No score yet':r.correct+' correct'}</p></div>${r.answered?button('New attempt','retry',`data-day="${l.day}"`,'secondary small'):''}</div><div class="note mb">Answer before checking. These questions have explicit answer keys. Open writing is saved for self-review, not graded by pretending a text match is a teacher.</div>${l.quiz.map((q,i)=>questionHTML(q,l.day,i)).join('')}${r.complete?`<div class="card mt"><div class="score-large">${r.percent}%</div><h3>${r.percent>=70?'Ready to continue the lesson.':'Review the explanations, then try again.'}</h3><p class="small muted">${r.correct} of ${r.total} answers correct on this attempt. Repeating an item helps recall but does not count as new assessment breadth.</p>${r.percent>=70?link('Continue to recall →',`lesson/${l.day}/vocab`):button('Start a fresh attempt','retry',`data-day="${l.day}"`)}</div>`:''}`;}
 function vocabMini(items){return `<div class="table-wrap"><table><thead><tr><th>Italian</th><th>Meaning</th></tr></thead><tbody>${items.map(v=>`<tr><td lang="it"><strong>${esc(v[0])}</strong><div class="small">${esc(v[2])}</div></td><td>${esc(v[1])}</td></tr>`).join('')}</tbody></table></div>`;}
 function reviewCard(day){const due=E.due(state);if(due.length)return due[reviewIndex%due.length];const limit=state.settings.pace==='gentle'?Math.min(3,state.settings.vocabTarget):state.settings.vocabTarget;if(E.introducedToday(state)>=limit)return null;return E.cardLibrary(state).find(c=>!state.cards[c.id]&&c.day<=day)||null;}
 function vocabTrainer(day=Math.min(E.currentDay(state),90)){const c=reviewCard(day),due=E.due(state),already=c&&state.cards[c.id];if(!c)return `<div class="card empty"><strong>${due.length?'Your queue is waiting.':'You’re clear for now.'}</strong><p>${Object.keys(state.cards).length?'No more eligible introductions or due cards right now. “Again” cards return after ten minutes. Review the library or come back later.':'Open today’s lesson and add its first useful phrases. Your daily target can be adjusted in Settings.'}</p><a href="#vocabulary/library">Browse the vocabulary library →</a></div>`;return `<div class="row between mb"><span class="pill">${due.length} due</span><span class="small muted">${E.introducedToday(state)} introduced today / ${state.settings.pace==='gentle'?Math.min(3,state.settings.vocabTarget):state.settings.vocabTarget} target</span></div><div class="card vocab-card"><div class="eyebrow">${already?'Recall in Italian':'New phrase · understand, then introduce'}</div><div class="flash-prompt">${esc(c.en)}</div>${already&&!revealed?`<p class="small muted">Say it aloud first. You can also type your attempt below.</p><input id="recall-answer" aria-label="Your recalled Italian" value="${esc(reviewAnswer)}" placeholder="Italian from memory…" autocomplete="off" spellcheck="false" style="max-width:400px;margin:0 auto 18px">${button('Reveal answer','reveal',`data-id="${c.id}"`,'')}`:`<div class="flash-answer" lang="it">${esc(c.it)} ${button(icon('sound'),'speak',`data-text="${esc(c.it)}" aria-label="Hear pronunciation"`,'ghost small')}</div><p lang="it">${esc(c.example)}</p>${c.de&&state.settings.explanations==='connections'?`<p class="small muted">German connection: ${esc(c.de)}</p>`:''}${c.note?`<p class="small muted">${esc(c.note)}</p>`:''}${reviewAnswer?`<div class="note">Your attempt: ${esc(reviewAnswer)}. ${E.normalize(reviewAnswer)===E.normalize(c.it)?'Matches the card.':'Compare it with the card; a different valid phrase may still communicate the idea.'} Rate your own recall below.</div>`:''}${!already?button('Introduce this phrase','introduce',`data-id="${c.id}"`):`<div class="ratings">${[['again','Again','10 min'],['hard','Hard','≥ 1 day'],['good','Good','Longer interval'],['easy','Easy','≥ 4 days']].map(([id,label,sub])=>`<button data-action="rate-card" data-id="${c.id}" data-rating="${id}">${label}<small>${sub}</small></button>`).join('')}</div><p class="small muted" style="margin-top:14px">Self-rated recall · next dates follow the transparent scheduler.</p>`}`}</div>`;}
 function vocabulary(){const tab=route.tab==='library'?'library':'review';return heading('Useful words, available when you need them','A vocabulary you can use.','Learn phrases in context. Recall them before revealing the answer, and space successful reviews.',button(icon('download')+' Anki CSV','csv','','secondary')+button('+ Add a phrase','add-card','','secondary'))+`<nav class="tabs" aria-label="Vocabulary views"><a class="tab" href="#vocabulary/review" aria-current="${tab==='review'?'page':'false'}">Due reviews & new phrases</a><a class="tab" href="#vocabulary/library" aria-current="${tab==='library'?'page':'false'}">Vocabulary library · ${E.cardLibrary(state).length}</a></nav>${tab==='review'?`<div style="max-width:680px;margin:auto">${vocabTrainer()}<details class="card mt"><summary><strong class="small">How your review dates are chosen</strong></summary><p class="small muted">Again → 10 minutes and reset successful repetitions. Hard → at least 1 day (previous interval × 1.2). Good → 1 day after no successful reviews, 3 after one, then at least 7 days and × 2.2. Hard/Good/Easy all count as successful recalls. Easy → at least 4 days and × 3. Intervals are capped at 365 days. Ratings apply only to due cards, preventing rapid repeat clicks from inflating intervals.</p><p class="small muted">Review history records the date, rating and interval. This is a practical heuristic, not a scientifically fitted memory model. At ${state.settings.reviewCap} due cards, new introductions pause.</p></details></div>`:`<div class="searchbar"><input id="vocab-search" aria-label="Search vocabulary" placeholder="Search Italian, English, German or topic…" value="${esc(filterText)}" data-input="vocab-search"><select id="vocab-filter" aria-label="Vocabulary status" data-change="vocab-filter">${[['all','All phrases'],['introduced','Introduced'],['due','Due now'],['new','Not introduced']].map(([v,t])=>`<option value="${v}" ${filterState===v?'selected':''}>${t}</option>`).join('')}</select></div><div id="vocab-table">${vocabTable()}</div>`}`;}
 function vocabTable(){const all=E.cardLibrary(state).filter(c=>{const record=state.cards[c.id],isDue=record&&Date.parse(record.nextReview)<=Date.now();return (filterState==='all'||filterState==='introduced'&&record||filterState==='due'&&isDue||filterState==='new'&&!record)&&[c.it,c.en,c.de,TOPICS[c.topic]?.title||'Custom'].join(' ').toLowerCase().includes(filterText.toLowerCase());});return `<div class="table-wrap"><table><thead><tr><th>Italian phrase</th><th>Meaning & context</th><th>Review</th><th>Action</th></tr></thead><tbody>${all.map(c=>{const r=state.cards[c.id];return `<tr><td><strong lang="it">${esc(c.it)}</strong><div class="small">${TOPICS[c.topic]?.title||'Custom'} · Day ${c.day}</div></td><td>${esc(c.en)}<div class="small" lang="it">${esc(c.example)}</div></td><td>${r?`Due ${dateText(r.nextReview)}<div class="small">${r.history.length} reviews</div>`:'Not introduced'}</td><td>${button('Details','card-details',`data-id="${c.id}"`,'secondary small')}</td></tr>`;}).join('')||'<tr><td colspan="4" class="empty">No matching phrases.</td></tr>'}</tbody></table></div><p class="small muted mt">${all.length} phrases shown. “Introduced” means you added the item, not that you mastered it.</p>`;}
 function listening(l){const t=TOPICS[l.topic],p=state.lessons[l.day];return `<div class="eyebrow">Comprehensible input</div><h2>Listen for meaning.</h2><p>${esc(l.listening)}</p><div class="row mb">${button(icon('sound')+' Play Italian dialogue','dialogue',`data-day="${l.day}"`)}${button('Stop audio','stop-speech','','secondary')}${button('Voice settings','voice-settings','','secondary')}${button('Start listening timer','timer-start',`data-skill="listening" data-day="${l.day}"`,'secondary')}</div><div class="note mb">Audio uses an installed Italian browser voice, if available. It is synthetic, not native recorded speech. If no Italian voice is available, use an external audio source or select reading mode below. Reading is tracked separately.</div><div class="field"><label for="listen-mode">What did you actually use?</label><select id="listen-mode" data-change="lesson-value" data-field="listenMode" data-day="${l.day}"><option value="">Choose a mode…</option>${[['audio','Original dialogue with Italian text-to-speech'],['external','External audio / video'],['reading','Reading fallback (not listening minutes)']].map(([v,x])=>`<option value="${v}" ${p?.listenMode===v?'selected':''}>${x}</option>`).join('')}</select></div><details class="mb"><summary><strong class="small">Reveal original transcript · try listening first</strong></summary><div class="dialogue" lang="it">${esc(t.dialogue)}</div></details><div class="row between"><h3>Check the details</h3>${button('Try the questions again','listen-retry',`data-day="${l.day}"`,'ghost small')}</div><p class="small muted">These questions refer to the original dialogue above. For an external clip, use the open reflection below instead.</p>${t.listen.map((q,i)=>{const value=p?.listenAnswers?.[i];return `<div class="question"><h3>${esc(q.prompt)}</h3>${value!==undefined?`<div class="feedback ${E.grade(q,value)?'':'incorrect'}">${E.grade(q,value)?'Correct.':`Answer: ${esc(q.answers[0])}.`} ${esc(q.why)}</div>`:`<div class="answers">${q.choices.map(c=>`<button class="choice" data-action="listen-answer" data-day="${l.day}" data-index="${i}" data-value="${esc(c)}">${esc(c)}</button>`).join('')}</div>`}</div>`;}).join('')}<form data-form="listening" data-day="${l.day}" class="card mt"><div class="field"><label for="listen-notes">Gist, two useful phrases, and one unclear detail</label><textarea id="listen-notes" name="notes" placeholder="What happened? Which phrases will you reuse? If external, record the title and position.">${esc(p?.notes||'')}</textarea></div>${ratingSelect('listenRating','How much did you understand?',p?.listenRating)}<button class="button" type="submit">Save listening reflection</button></form><div class="note mt">Repeat two short sentences aloud. Listen again and notice word boundaries and double consonants. Your comprehension rating is self-reported; detail answers use an answer key.</div>${resourceAssignment(l)}`;}
 function ratingSelect(name,label,value){return `<div class="field"><label for="${name}">${label}</label><select id="${name}" name="${name}" required><option value="">Choose a self-rating…</option>${RUBRIC.map(([v,t])=>`<option value="${v}" ${String(value)===v?'selected':''}>${v} · ${t}</option>`).join('')}</select></div>`;}
 function output(l){const t=TOPICS[l.topic],p=state.lessons[l.day];return `<div class="eyebrow">Meaningful output</div><h2>Something worth saying.</h2><div class="card mb"><h3>Your speaking challenge</h3><p>${esc(l.output)}</p>${state.settings.pace==='stretch'?'<div class="note mb">Optional stretch: ask two follow-up questions without notes and change one detail in your role-play. Keep familiar grammar; stop if comprehension breaks down.</div>':''}<div class="row">${button(icon('copy')+' Practise with ChatGPT','tutor',`data-day="${l.day}"`)}${button(icon('clock')+' Speaking timer','timer-start',`data-skill="speaking" data-day="${l.day}"`,'secondary')}</div></div>${recordingUI()}<form data-form="output" data-day="${l.day}" class="card mt"><h3>Write it in your own words</h3><p class="small muted">${esc(l.day===90?'Write 100–120 words covering your profile, a past day and future plans.':t.write)}</p><div class="field"><label for="writing-draft">Your Italian draft · saved when you press Save</label><textarea id="writing-draft" name="draft" lang="it" spellcheck="true" style="min-height:170px" placeholder="Write from memory first…">${esc(p?.draft||'')}</textarea></div><p class="small muted">No automated grade for open writing. Check verb/person, article and adjective agreement, time reference and clarity. Use the tutor prompt for targeted corrections.</p><div class="split-field">${ratingSelect('speakRating','Speaking · self-assessment',p?.speakRating)}${ratingSelect('writeRating','Writing · self-assessment',p?.writeRating)}</div><p class="small muted">Rate an unattempted skill 0 (“not yet”). A score is a reflection on this task, not general proficiency.</p><button class="button" type="submit">Save draft & self-ratings</button> ${button('Writing timer','timer-start',`data-skill="writing" data-day="${l.day}"`,'secondary')}</form><details class="card mt"><summary><strong class="small">Use a consistent self-assessment rubric</strong></summary>${RUBRIC.map(([n,title,desc])=>`<p class="small"><strong>${n} · ${title}</strong><br>${desc}</p>`).join('')}<p class="small muted">Consider task completion, intelligibility, grammatical control and response to a follow-up. A partner can help you judge; this app does not score pronunciation.</p></details>`;}
 function recordingUI(){return `<div class="recording"><div class="row between"><div><h3>Hear yourself speak</h3><p class="small muted" style="margin:0">Optional microphone recording; stays on this device.</p></div>${button(icon('mic')+(recorder.instance?.state==='recording'?' Stop recording':' Record'),'record','','secondary small')}</div><div id="recording-status" class="small muted mt">${recorder.instance?.state==='recording'?'Recording… press Stop when finished.':!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder?'Recording is unavailable here. Try Safari/Chrome on HTTPS or localhost, or use Voice Memos on your iPhone.':'Microphone permission will be requested only when you press Record.'}</div>${recorder.url?`<audio controls src="${esc(recorder.url)}"></audio>${button('Download recording','download-recording','','secondary small')}<p class="small muted">Download before leaving. Audio is not stored in progress backups.</p>`:''}</div>`;}
 function finish(l){const p=state.lessons[l.day],score=E.quizResult(state,l.day),checks=p?.checks||[],first=p?.attempts[0],firstScore=first?E.quizResult(state,l.day,first):null;return `<div class="eyebrow">Review & consolidate</div><h2>${p?.completedAt?'This day is complete.':'What can you do now?'}</h2><p>${esc(l.goal)}</p><div class="grid2"><div class="card"><div class="eyebrow">Current quiz attempt</div><div class="score-large">${score.percent===null?'—':score.percent+'%'}</div><p class="small muted">${score.answered}/${score.total} questions answered. ${firstScore?.complete?'First attempt: '+firstScore.percent+'%.':''}</p></div><div class="card"><div class="eyebrow">Study activities</div>${[['learn','Structured learning'],['vocab','Vocabulary recall'],['listen','Listening / reading'],['output','Speaking / writing']].map(([id,label])=>`<div class="row small" style="margin:9px 0">${icon(checks.includes(id)?'check':'clock')}${label}</div>`).join('')}</div></div><div class="note mt">To finish: complete all four activities and score at least 70% on a full quiz attempt. This gate controls the learning sequence. It does not certify mastery; weak-topic estimates use distinct question evidence.</div><div class="row mt">${button(p?.completedAt?'Already completed ✓':'Complete this study day','complete',`data-day="${l.day}" ${p?.completedAt?'disabled':''}`)}${p?.completedAt&&l.day<90?link('Continue to Day '+(l.day+1)+' →',`lesson/${l.day+1}/learn`,''):''}${link('Revisit exercises',`lesson/${l.day}/quiz`)}${button('Log or correct study time','log',`data-day="${l.day}"`,'secondary')}</div>${MILESTONES.some(m=>m.day===l.day)?milestoneForm(l.day):''}${l.day===90?`<section class="card mt"><h3>Your cumulative assessment</h3><ol class="checklist"><li>Complete the 24-question cumulative quiz without notes.</li><li>Listen to two original passages (for example, travel and story); identify gist and details without the transcript.</li><li>Read the opinion passage and explain its main idea.</li><li>Write 100–120 words about yourself, yesterday and next weekend.</li><li>Have a five-minute unscripted exchange with a patient partner or tutor; answer follow-up questions.</li><li>Save the four-skill self-review below and export your data.</li></ol><p class="small muted">A score on this small in-app test cannot establish a formal CEFR level. Use the descriptors to identify what you can do and where support is still needed.</p></section>`:''}`;}
 function milestoneForm(day){const m=MILESTONES.find(m=>m.day===day),a=state.assessments[day];return `<form class="card mt" data-form="milestone" data-day="${day}"><div class="eyebrow">CEFR-aligned reflection · not certification</div><h3>${m.title}</h3><p class="small muted">${m.descriptor}</p><div class="grid2">${['listening','reading','speaking','writing'].map(k=>ratingSelect(k,k[0].toUpperCase()+k.slice(1),a?.ratings[k])).join('')}</div><div class="field"><label for="milestone-notes">Evidence: what could you do, and what help did you need?</label><textarea id="milestone-notes" name="notes">${esc(a?.notes||'')}</textarea></div><button class="button" type="submit">Save milestone reflection</button></form>`;}
 const SCENARIOS=['Introducing myself','Ordering coffee','Buying groceries','Asking for directions','Checking into a hotel','Discussing university life','Talking about yesterday','Making weekend plans'];
 function lab(){const day=Math.min(E.currentDay(state),90),l=LESSONS[day-1];return heading('Listen. Speak. Make yourself understood.','The practice lab.','Short, purposeful tasks that turn lessons into conversation.',button('Log a practice session','log',`data-day="${day}"`,'secondary'))+`<div class="grid2"><section class="card"><div class="eyebrow">Today’s input</div><h2>${TOPICS[l.topic].title}</h2><p class="small muted">${esc(l.listening)}</p><div class="row">${link('Open listening task',`lesson/${day}/listen`)}${button('Reading timer','timer-start',`data-skill="reading" data-day="${day}"`,'secondary')}</div></section><section class="card"><div class="eyebrow">Today’s output</div><h2>A real purpose.</h2><p class="small muted">${esc(l.goal)}</p><div class="row">${link('Open speaking & writing',`lesson/${day}/output`)}${button('Copy tutor prompt','copy-tutor',`data-day="${day}"`,'secondary')}</div></section></div><section class="section"><div class="section-title"><h2>Choose a conversation</h2><span class="small muted">Context follows your actual progress</span></div><div class="topic-list">${SCENARIOS.map((x,i)=>`<button class="topic-button" data-action="tutor" data-scenario="${esc(x)}" data-day="${day}"><strong>${String(i+1).padStart(2,'0')} · ${x}</strong><span class="muted">Generate a level-aware practice prompt ↗</span></button>`).join('')}</div></section><div class="grid2 section"><section class="card"><h2>Your resource bookmarks</h2><form data-form="bookmarks"><div class="split-field"><div class="field"><label for="lt-track">Language Transfer · next track</label><input id="lt-track" name="ltTrack" type="number" min="1" max="100" value="${state.lab.ltTrack}" required></div><div class="field"><label for="coffee-episode">Coffee Break · next Season 1 episode</label><input id="coffee-episode" name="coffeeEpisode" type="number" min="1" max="200" value="${state.lab.coffeeEpisode}" required></div></div><button class="button secondary" type="submit">Save bookmarks</button></form><p class="small muted mt">Use Language Transfer sequentially: pause, construct, speak, compare, repeat. This app does not assert unverified track topics or episode availability.</p></section><section class="card"><h2>From Week 4: a real exchange</h2><p class="small muted">Start with five minutes of Italian and give your partner equal time in German or English. Choose one scenario, prepare five useful phrases, ask one follow-up and note a communication gap afterwards.</p>${external(RESOURCES.find(r=>r.id==='exchange'))}<p class="small muted mt">If you cannot find a partner yet, record both sides of a dialogue or use the copied prompt in ChatGPT voice mode when available. No AI model runs inside this app.</p></section></div><section class="section"><div class="section-title"><h2>Original dialogue library</h2><span class="small muted">${Object.keys(TOPICS).length} short passages</span></div><div class="topic-list">${Object.values(TOPICS).map(t=>`<button class="topic-button" data-action="topic" data-topic="${t.id}"><strong>${esc(t.title)}</strong><span class="muted">${esc(t.objective)}</span></button>`).join('')}</div></section>`;}
 function progress(){const s=E.stats(state),ts=E.topics(state),max=Math.max(1,...Object.values(s.bySkill)),recent=Object.entries(state.lessons).flatMap(([d,l])=>l.attempts.map((a,i)=>({day:+d,attempt:i+1,at:a.at,...E.quizResult(state,+d,a)}))).filter(r=>r.complete).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,12);return heading('Measure learning, not clicks','Your progress, honestly.','Study time, objective answer evidence and self-assessments each tell a different part of the story.',button('+ Log or adjust time','log','','secondary'))+`<div class="stats" style="margin-top:0">${stat('Active study',fmt(s.total/60)+'<small> h</small>',fmt(s.passive)+' passive minutes excluded','clock')}${stat('Lessons completed',s.completed+'<small> / 90</small>',Math.round(s.completed/90*100)+'% of the roadmap','book')}${stat('Vocabulary recall',s.recall===null?'—':s.recall+'<small>%</small>',`${s.reviews} self-rated reviews · ${s.due} due`,'cards')}${stat('Quiz accuracy',s.quizAccuracy===null?'—':s.quizAccuracy+'<small>%</small>',`${s.quizCount} first-attempt answers`,'chart')}</div><div class="grid2 section"><section class="card"><h2>Your last 14 days</h2>${barChart(14)}<p class="small muted">${s.weekDays} active study days and ${fmt(s.week)} minutes so far this calendar week. A day counts when you log focused time.</p></section><section class="card"><h2>Time across skills</h2>${E.SKILLS.map(k=>`<div class="skill-row"><span>${k[0].toUpperCase()+k.slice(1)}</span><div class="meter"><span style="width:${s.bySkill[k]/max*100}%"></span></div><span>${fmt(s.bySkill[k])} min</span></div>`).join('')}</section></div><div class="grid2 section"><section class="card"><h2>Assessment evidence</h2>${ts.length?ts.map(t=>`<div class="advice"><div class="row between"><h3>${esc(t.title)}</h3><span class="pill ${t.n<3?'outline':''}">${t.percent}%</span></div><p>${t.n} distinct prompts · ${t.n<3?'Too little evidence for an estimate':t.percent<70?'Needs more practice':t.percent>=85?'Strong on assessed items':'Developing on assessed items'}</p>${t.errors.length?`<details><summary class="small">${t.errors.length} recent error${t.errors.length!==1?'s':''}</summary>${t.errors.map(e=>`<p class="small"><strong>${esc(e.prompt)}</strong><br>Your answer: ${esc(e.value)}<br>Key: ${esc(e.answer)}<br>${esc(e.why)}</p>`).join('')}</details>`:''}${t.recurring.length?`<p class="small muted mt">Recurring patterns: ${t.recurring.map(e=>esc(e.prompt)+' ('+e.failures+' incorrect attempts'+(e.correct?', latest corrected':'')+')').join('; ')}</p>`:''}${button('Targeted practice','topic',`data-topic="${t.id}"`,'ghost small')}</div>`).join(''):'<div class="empty">Complete a few questions to reveal strengths and recurring errors.</div>'}<p class="small muted mt">Latest answers to unique original prompts are used for topic estimates. Retakes cannot manufacture breadth by repeating one question. Prompt difficulty and familiarity limit these estimates.</p></section><section class="card"><h2>Quiz performance over time</h2>${recent.length?recent.map(r=>`<div class="timeline-row"><span class="muted">${dateText(r.at)}</span><div><strong>Day ${r.day} · attempt ${r.attempt}</strong><div class="meter" style="margin-top:8px"><span style="width:${r.percent}%"></span></div></div><strong style="text-align:right">${r.percent}%</strong></div>`).join(''):'<div class="empty">Completed quiz attempts will appear here.</div>'}<h3 class="mt">Introduced vocabulary</h3><p class="small muted">${s.known} phrases introduced · ${s.due} due · ${s.reviews} recall ratings. Retention here means self-rated successful recalls (Hard/Good/Easy), not a controlled memory test.</p><h3>Writing practice</h3><p class="small muted">${Object.values(state.lessons).filter(l=>l.draft.trim()).length} saved lesson drafts · ${Object.values(state.lessons).reduce((n,l)=>n+(l.draft.trim()?l.draft.trim().split(/\s+/).length:0),0)} words in current drafts.</p></section></div><section class="section"><div class="section-title"><h2>Milestones & self-assessment</h2><span class="small muted">Task descriptors, not certification</span></div><div class="grid2">${MILESTONES.map(m=>{const a=state.assessments[m.day];return `<div class="card"><div class="eyebrow">Day ${m.day} · ${state.lessons[m.day]?.completedAt?'Checkpoint completed':'Checkpoint pending'}</div><h3>${m.title}</h3><p class="small muted">${m.descriptor}</p>${a?`<div class="tag-list">${Object.entries(a.ratings).map(([k,v])=>`<span class="pill outline">${k}: ${v}/3 self-rated</span>`).join('')}</div><p class="small muted mt">${esc(a.notes)}</p>`:'<p class="small muted">No self-assessment recorded.</p>'}${link('Open reflection',`lesson/${m.day}/finish`,'secondary small')}</div>`;}).join('')}</div></section><section class="section"><div class="section-title"><h2>Study history</h2>${button('Add a manual entry','log','','secondary small')}</div>${historyTable()}</section>`;}
 function historyTable(){const logs=[...state.logs].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,100);return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Activity</th><th>Minutes</th><th>Notes</th><th>Correct</th></tr></thead><tbody>${logs.map(l=>`<tr><td>${esc(l.date)}</td><td>${l.skill}<div class="small">${l.mode}${l.lessonDay?' · Day '+l.lessonDay:''}</div></td><td>${fmt(l.minutes)}</td><td class="history-note">${esc(l.note)}</td><td>${button('Edit','log',`data-id="${esc(l.id)}"`,'secondary small')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No study time logged yet. Use a focus timer or add a manual entry.</td></tr>'}</tbody></table></div><p class="small muted mt">Showing the latest ${logs.length} of ${state.logs.length} entries. All entries are included in backups and calculations. Edit an entry to change its date, duration, category or active/passive classification.</p>`;}
 function resources(){return heading('A small, purposeful collection','Your companion resources.','Original lessons are the core. Use these external resources for extra structure, native input and real conversation.')+`<div class="note warning mb"><strong>Availability note · 30 October 2026</strong><p>The search service failed and this environment denied direct access to all ten supplied resource URLs. None is labelled live-verified. Current login requirements, free access and regional playback must be checked at the provider. The edX closing date is user-supplied and unconfirmed. No paid resource is required by this app.</p></div><div class="searchbar"><label for="resource-skill" class="small">Skill</label><select id="resource-skill" data-change="resource-skill">${['all','Grammar','Listening','Reading','Vocabulary','Speaking','Mixed'].map(x=>`<option value="${x}" ${resourceSkill===x?'selected':''}>${x==='all'?'All skills':x}</option>`).join('')}</select><label for="resource-level" class="small">Level</label><select id="resource-level" data-change="resource-level">${['all','A0','A1','A2'].map(x=>`<option value="${x}" ${resourceLevel===x?'selected':''}>${x==='all'?'All levels':x}</option>`).join('')}</select></div><div class="grid2" id="resource-grid">${resourceCards()}</div><section class="card section"><h2>Why the programme works this way</h2><p class="small muted">A balanced design uses retrieval, spacing, understandable input, meaningful output and feedback. Interleaving earlier material helps discriminate forms, but its benefit depends on the task; it is not a universal guarantee. The 90-day sequence, session split, mastery thresholds and SRS intervals are practical design choices.</p>${EVIDENCE.map(e=>`<div class="advice"><h3>${e.title}</h3><p>${e.text}</p><p class="small mt"><a href="${e.url}" target="_blank" rel="noopener noreferrer">${e.source}</a> · citation supplied from established literature; live source access unavailable.</p></div>`).join('')}<p class="small muted mt">Age 23 is not a problem to solve. There is no promise of a fixed fluency timeline or an A2 certificate after 67.5 hours. Regular communication and feedback matter beyond completing exercises.</p></section>`;}
 function resourceCards(){return RESOURCES.filter(r=>(resourceSkill==='all'||r.skill===resourceSkill)&&(resourceLevel==='all'||r.level==='All'||r.level.includes(resourceLevel)||(resourceLevel==='A1'&&r.level==='A0–A2'))).map(r=>`<article class="card resource-card"><div class="tag-list"><span class="pill">${r.level}</span><span class="pill outline">${r.format}</span><span class="pill outline">Phase ${r.phase}</span></div><h3>${r.name}</h3><p>${r.how}</p><details><summary>Access & limitations</summary><p>${r.access}</p><p class="mt">${r.limit}</p></details><p class="small">${r.status} · ${r.checked}</p>${external(r)}</article>`).join('')||'<div class="empty">No resources match these filters.</div>';}
 function settings(){const p=state.settings;return heading('Make the routine fit your life','Settings & your data.','Everything is kept on this browser. Backups let you move progress manually between devices.')+`<div class="grid2"><form class="card" data-form="settings"><h2>Your study rhythm</h2><div class="split-field"><div class="field"><label for="name">Your name</label><input id="name" name="name" maxlength="80" value="${esc(p.name)}" required></div><div class="field"><label for="start-date">Study start date</label><input id="start-date" name="startDate" type="date" value="${p.startDate}" required></div></div><div class="split-field"><div class="field"><label for="daily-minutes">Custom daily minutes</label><input id="daily-minutes" name="dailyMinutes" type="number" min="10" max="180" value="${p.dailyMinutes}" required></div><div class="field"><label for="default-session">Default session</label><select id="default-session" name="session">${[['quick','Quick · 20 minutes'],['standard','Standard · 45 minutes'],['intensive','Intensive · 85 minutes'],['review','Weekly review · 45 minutes'],['custom','Use custom daily minutes']].map(([v,t])=>`<option value="${v}" ${p.session===v?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="field"><label>Preferred study days</label><div class="day-picks">${[1,2,3,4,5,6,0].map(n=>`<label><input type="checkbox" name="days" value="${n}" ${p.days.includes(n)?'checked':''}>${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][n]}</label>`).join('')}</div></div><div class="split-field"><div class="field"><label for="target">New phrases per day · maximum</label><input id="target" name="vocabTarget" type="number" min="0" max="10" value="${p.vocabTarget}" required></div><div class="field"><label for="review-cap">Pause new items at this due backlog</label><input id="review-cap" name="reviewCap" type="number" min="5" max="100" value="${p.reviewCap}" required></div></div><div class="split-field"><div class="field"><label for="theme">Theme</label><select id="theme" name="theme">${['light','dark','system'].map(v=>`<option value="${v}" ${p.theme===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label for="pace">Learning pace</label><select id="pace" name="pace">${[['gentle','Gentle · at most 3 new phrases'],['steady','Steady · your chosen target'],['stretch','Stretch · add optional output']].map(([v,t])=>`<option value="${v}" ${p.pace===v?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="field"><label for="explanations">Explanation language</label><select id="explanations" name="explanations"><option value="connections" ${p.explanations==='connections'?'selected':''}>English with German comparisons</option><option value="english" ${p.explanations==='english'?'selected':''}>English only</option></select><span class="field-hint">The interface and full explanations are English. German comparisons are optional.</span></div><button class="button" type="submit">Save preferences</button><p class="small muted mt">Session length changes time estimates, not the prerequisite chain. Quick sessions may need two visits to finish a day. Stretch adds a follow-up challenge; it never auto-promotes your level.</p></form><div class="stack"><section class="card" id="voice-panel">${voicePanelHTML()}</section><section class="card"><h2>Keep a copy.</h2><p class="small muted">Export after a study session or before moving devices. JSON includes settings, lesson drafts, attempts, review history and all study logs. Import replaces the current data after a preview and confirmation; it does not merge two timelines.</p><div class="row">${button(icon('download')+' Export progress JSON','export')}${button(icon('upload')+' Import backup','import','','secondary')}</div><input id="import-file" type="file" accept=".json,application/json" class="hidden"><div class="note mt">Mac and iPhone do not automatically synchronise. On the destination device, import your latest backup before continuing. Keep one authoritative copy to avoid divergent histories.</div></section><section class="card"><h2>Local, under your control.</h2><p class="small muted">No telemetry, external database or automatic uploads. Opening provider links sends you to those services. Voice synthesis may be handled by your browser or operating system; microphone audio stays in memory until you download it. Audio recordings are not included in JSON backups.</p><p class="small muted">Private browsing, storage restrictions, clearing website data or changing the app’s address can make progress unavailable. Export a backup regularly. “Saved” means saved in this browser only.</p></section><section class="card"><h2>Other exports</h2><div class="row">${button('Anki-compatible CSV','csv','','secondary')}${button('Readable programme','print-programme','','secondary')}${button('Study history CSV','logs-csv','','secondary')}</div></section><section class="card"><h3>Start over on this browser</h3><p class="small muted">This removes the current in-app history after confirmation. Export first if you want to preserve it.</p>${button('Reset local learning data','reset','','danger')}</section></div></div>`;}
 function help(){return heading('Start here, then make it a habit','Your first five minutes.','A local learning system for Mac and iPhone, with no required subscription.')+`<div class="grid2"><section class="card"><h2>Start learning</h2><ol class="checklist"><li>Open Day 1 from Overview. Read the short explanation and say the examples aloud.</li><li>Try the quiz before looking at answers. Use the feedback to correct a meaningful error.</li><li>Introduce a few phrases and review them by recalling Italian from English.</li><li>Listen to the original dialogue with an Italian voice, or use an external free audio source. If you read instead, choose reading mode.</li><li>Complete the speaking/writing task, save your draft and self-ratings, and mark the four activities.</li><li>Complete the study day. The next day becomes available in order.</li></ol><p class="small muted">Use a focus timer or manual time entry. Completion does not create fictional study minutes.</p>${link('Start your next lesson',`lesson/${Math.min(E.currentDay(state),90)}/learn`)}</section><section class="card"><h2>Open on Mac & iPhone</h2><p class="small muted"><strong>Mac:</strong> Download Italiano.html and open it in a modern browser. No installation is needed. Keep the file in the same location and use the same browser; local-file storage behaviour varies, so keep JSON backups.</p><p class="small muted"><strong>iPhone:</strong> A local HTML attachment may open in a non-interactive file preview. For reliable daily use, serve the included index.html from a static HTTPS host and open that URL in Safari. Add it to the Home Screen if offered. The package includes an optional service worker for hosted offline use.</p><p class="small muted">The app is prepared for static hosting but has not been published to a public URL. Hosting instructions are in the included guide. No account is required for the app itself; a hosting provider may require one.</p><div class="note">Export/import is the cross-device transfer method. There is no live sync.</div></section><section class="card"><h2>Daily and weekly rhythm</h2><p class="small muted">Standard: 15 minutes structured work, 10 recall, 10 listening, 10 speaking/writing. Quick: 6/5/4/5. Intensive: 25/20/20/20. Weekly review: 10/15/10/10; prioritise the current checkpoint and weak topics.</p><p class="small muted">Miss a day? Return to the first unfinished day. After three missed planned days, use a lighter session. Your upcoming dates move; the next day is not overloaded with missed work.</p><p class="small muted">At 45 minutes daily, 90 days schedules 67.5 hours. Time alone cannot promise A2 or conversational fluency. Descriptors and actual communication guide the next stage.</p></section><section class="card"><h2>Know the limits</h2><ul class="checklist"><li>No model, automatic speech assessment or API integration is built into this app.</li><li>Objective exercises accept listed alternatives; valid unlisted expressions can be discussed with a tutor. Accents remain meaningful.</li><li>Speaking/writing quality uses explicit self-ratings. CEFR descriptions are informal task reflections.</li><li>External links were supplied by you; live checks were blocked in the build environment.</li><li>Recordings require browser support and permission. Download audio before leaving.</li><li>The focus timer pauses when this tab becomes hidden, avoiding accidental background time. Log genuine external study manually.</li></ul></section></div><section class="card section"><h2>Continue beyond Day 90</h2><p>Cycle through weak-topic repair, understandable input, conversations and a weekly writing sample. Keep the same tracker and card schedules. Increase difficulty when you can complete familiar tasks with less support, not because the calendar says so.</p>${button('Create next-cycle plan','continuation','','secondary')}</section><p class="footer-note">Italiano ${CONTENT_VERSION} · Original educational content and dependency-free application. No third-party lessons, audio or video are copied into the app.</p>`;}
 function more(){return heading('Your learning space','Explore Italiano.','Everything you need for the next 90 days.')+`<div class="topic-list">${[...NAV,['settings','settings','Settings & data'],['help','help','Getting started']].map(([id,ic,name])=>`<a class="topic-button" href="#${id}" style="text-decoration:none;color:inherit"><strong>${icon(ic)} ${name}</strong><span class="muted">Open →</span></a>`).join('')}</div>`;}
 function modal(title,html){$('#modal-content').innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="icon-button" data-action="close-modal" aria-label="Close dialog">${icon('close')}</button></div>${html}`;const d=$('#modal');if(!d.open)d.showModal();document.body.classList.add('modal-open');}
 function closeModal(){const d=$('#modal');d.close();document.body.classList.remove('modal-open');pendingImport=null;}
 function tutorModal(day,scenario){const prompt=E.tutor(state,day,scenario||SCENARIOS[0]);modal('Practise with ChatGPT',`<p class="small muted">This copies context for a separate ChatGPT conversation. Voice mode availability depends on your ChatGPT access. No API key or in-app AI model is used.</p><label class="sr-only" for="tutor-prompt">Your tutor prompt</label><textarea id="tutor-prompt" class="prompt-text" readonly>${esc(prompt)}</textarea><div class="modal-actions">${button(icon('copy')+' Copy prompt','copy-prompt')}<a class="button secondary" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">Open ChatGPT ↗</a></div>`);}
 async function copy(text){try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);toast('Prompt copied. Paste it into a ChatGPT conversation.');return;}}catch{}const el=document.createElement('textarea');el.value=text;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();let ok=false;try{ok=document.execCommand('copy');}catch{}el.remove();if(ok)toast('Copied to clipboard.');else{modal('Copy your prompt',`<p class="small muted">This browser blocks automatic clipboard access. Select and copy this text manually.</p><textarea id="manual-copy" class="prompt-text" readonly>${esc(text)}</textarea>`);$('#manual-copy').focus();$('#manual-copy').select();}}
 function download(name,type,text){const blob=text instanceof Blob?text:new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
 function exportData(){download(`Italiano-progress-${E.localDay()}.json`,'application/json',JSON.stringify(E.backup(state),null,2));toast('Backup download requested. Keep the JSON file for your next device.');}
 async function importFile(file){if(!file)return;if(file.size>8*1024*1024){toast('Backup is too large. Limit: 8 MB.');return;}try{const candidate=E.validate(JSON.parse(await file.text()));pendingImport=candidate;const s=E.stats(candidate);modal('Review this backup',`<p>This will replace this browser’s current learning data. It does not merge histories.</p><div class="note"><strong>${esc(candidate.settings.name)}</strong> · ${s.completed} completed lessons · ${s.known} introduced phrases · ${fmt(s.total)} active minutes</div><p class="small muted mt">A JSON copy of your current state will be downloaded before replacement. Keep it if you may need to undo.</p><div class="modal-actions">${button('Cancel','close-modal','','secondary')}${button('Replace with this backup','confirm-import')}</div>`);}catch(e){toast(e.message);}}
 function logModal(id,day){const old=state.logs.find(x=>x.id===id),d=Number(day)||route.day||Math.min(E.currentDay(state),90);modal(old?'Correct study history':'Log focused practice',`<form data-form="log"><input type="hidden" name="id" value="${esc(old?.id||'')}"><div class="split-field"><div class="field"><label for="log-date">Date</label><input id="log-date" type="date" name="date" value="${old?.date||E.localDay()}" required></div><div class="field"><label for="log-minutes">Actual minutes studied</label><input id="log-minutes" type="number" name="minutes" min="0.1" max="600" step="0.1" value="${old?.minutes||''}" required placeholder="e.g. 10"></div></div><div class="split-field"><div class="field"><label for="log-skill">Skill</label><select id="log-skill" name="skill">${E.SKILLS.map(k=>`<option value="${k}" ${(old?.skill||'grammar')===k?'selected':''}>${k}</option>`).join('')}</select></div><div class="field"><label for="log-mode">Practice type</label><select id="log-mode" name="mode"><option value="active" ${old?.mode==='active'?'selected':''}>Focused active study</option><option value="passive" ${old?.mode==='passive'?'selected':''}>Passive exposure (separate)</option></select></div></div><div class="field"><label for="log-day">Curriculum day · optional</label><input id="log-day" type="number" name="lessonDay" min="1" max="90" value="${old?.lessonDay||d}"></div><div class="field"><label for="log-note">What did you do?</label><input id="log-note" name="note" maxlength="2000" value="${esc(old?.note||'')}" placeholder="e.g. Language Transfer, track 2"></div><p class="small muted">Log actual focused time, not the planned estimate. Avoid duplicating a timer entry.</p><div class="modal-actions">${old?button('Delete entry','delete-log',`data-id="${esc(old.id)}"`,'danger'):''}<button class="button" type="submit">Save entry</button></div></form>`);}
 function cardModal(id){const c=E.cardLibrary(state).find(x=>x.id===id),r=state.cards[id];if(!c)return;modal('Phrase details',`<div class="flash-answer" lang="it">${esc(c.it)}</div><p>${esc(c.en)}</p><div class="example"><strong lang="it">${esc(c.example)}</strong></div><p class="small muted mt">${esc(c.note)} ${esc(c.de)}</p>${button('Hear Italian','speak',`data-text="${esc(c.it)}"`,'secondary small')}${r?`<dl class="small"><dt>Introduced</dt><dd>${new Date(r.introducedAt).toLocaleString()}</dd><dt>Last review</dt><dd>${r.lastReview?new Date(r.lastReview).toLocaleString():'Not reviewed yet'}</dd><dt>Next review</dt><dd>${new Date(r.nextReview).toLocaleString()}</dd><dt>Interval</dt><dd>${fmt(r.interval)} days</dd></dl><h3>Recall history</h3>${r.history.slice(-20).reverse().map(h=>`<p class="small">${new Date(h.at).toLocaleString()} · ${h.rating} · next interval ${fmt(h.interval)} days</p>`).join('')||'<p class="small muted">No reviews yet.</p>'}`:`<p class="small muted mt">Available from Day ${c.day}. New cards respect your daily target and due backlog.</p>${button('Introduce phrase','introduce',`data-id="${c.id}" ${c.day>Math.min(E.currentDay(state),90)?'disabled':''}`)}`}`);}
 function topicModal(id){const t=TOPICS[id];if(!t)return;const d=LESSONS.find(l=>l.id===id)?.day||1;modal(t.title,`<p>${esc(t.explain)}</p>${state.settings.explanations==='connections'?`<div class="note">${esc(t.de)}</div>`:''}<div class="examples">${t.examples.map(([it,en])=>`<div class="example"><strong lang="it">${esc(it)}</strong><span>${esc(en)}</span></div>`).join('')}</div><details><summary>Original listening passage</summary><div class="dialogue" lang="it">${esc(t.dialogue)}</div></details><div class="row mt">${button('Hear passage','speak',`data-text="${esc(t.dialogue)}"`,'secondary')}${button('Open targeted exercises','goto',`data-hash="lesson/${d}/quiz"`)}</div><p class="small muted mt">Explain the rule, make two new examples, then attempt the questions without notes. Repeating these items updates existing evidence; it does not add new question breadth.</p>`);}
 function addCardModal(){modal('Add a useful phrase',`<form data-form="add-card">${[['it','Italian phrase'],['en','English meaning'],['example','Example sentence in Italian'],['de','German connection · optional'],['note','Grammar note · optional']].map(([key,label])=>`<div class="field"><label for="card-${key}">${label}</label><input id="card-${key}" name="${key}" maxlength="${key==='it'?300:500}" ${['it','en','example'].includes(key)?'required':''}></div>`).join('')}<p class="small muted">Duplicate Italian phrases are blocked. The card is added to the library; introduction still respects your review queue.</p><button class="button" type="submit">Add to vocabulary</button></form>`);}
 function elapsed(){return timer.elapsed+(timer.running?performance.now()-timer.started:0);}
 function renderTimer(){const el=$('#timer-ui');if(!el)return;const sec=Math.floor(elapsed()/1000),time=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;el.innerHTML=sec||timer.running?`<div class="timer"><span class="timer-label">${timer.skill}</span><span class="timer-clock">${time}</span><button data-action="timer-pause" aria-label="${timer.running?'Pause':'Resume'} timer">${icon(timer.running?'pause':'play')}</button><button data-action="timer-save" aria-label="Save focused time">${icon('check')}</button></div>`:button(icon('clock')+' Focus','timer-start',`data-skill="grammar" data-day="${Math.min(E.currentDay(state),90)}"`,'ghost small');}
 function startTimer(skill,day){if(timer.running||timer.elapsed){if(timer.skill===skill&&timer.day===day){if(!timer.running){timer.started=performance.now();timer.running=true;}renderTimer();return;}pauseTimer();modal('Save the current timer first',`<p class="small muted">You have ${fmt(elapsed()/60000)} minutes of ${timer.skill} in progress. Save or discard it before starting a different activity.</p><div class="modal-actions">${button('Discard time','timer-discard','','secondary')}${button('Save focused time','timer-save')}</div>`);return;}timer.skill=skill;timer.day=day;timer.started=performance.now();timer.running=true;autoPaused=false;renderTimer();toast('Focus timer started. It pauses if you leave this tab.');}
 function pauseTimer(){if(timer.running){timer.elapsed+=performance.now()-timer.started;timer.running=false;}renderTimer();}
 function saveTimer(){pauseTimer();const minutes=elapsed()/60000;if(minutes<.01){toast('Start a focused activity before saving time.');return;}E.log(state,{minutes:Math.min(600,minutes),skill:timer.skill,mode:'active',lessonDay:timer.day,note:'Focus timer · visible-tab time'},Date.now());timer.elapsed=0;persist();if($('#modal').open)closeModal();render(true);toast('Focused time saved.');}
 function voicePanelHTML(){const v=speech.snapshot();return `<div class="eyebrow">Italian voice · v${CONTENT_VERSION}</div><h3>Choose the voice you want to hear</h3><p class="small muted">Your choice stays on this browser, including after refresh. Available voices differ between Mac and iPhone. Preview them to choose the most natural one.</p>${!v.supported?'<div class="note warning">This browser does not support speech playback.</div>':`<div class="field"><label for="italian-voice">Italian voice</label><select id="italian-voice" data-change="italian-voice"><option value="" ${!v.selectedKey?'selected':''} disabled>${v.voices.length?'Choose a voice, or preview the suggested one':'No Italian voices available yet'}</option>${v.missing?`<option value="${esc(v.selectedKey)}" selected disabled>${esc(v.selectedName)} · unavailable</option>`:''}${v.voices.map(x=>`<option value="${esc(x.key)}" ${v.selectedKey===x.key?'selected':''}>${esc(x.name)} · ${esc(x.lang)}${x.localService?' · on-device':' · browser service'}</option>`).join('')}</select></div><div class="field"><label for="italian-rate">Playback speed</label><select id="italian-rate" data-change="italian-rate">${[.7,.8,.85,.9,.95,1,1.1,...(![.7,.8,.85,.9,.95,1,1.1].includes(v.rate)?[v.rate]:[])].sort((a,b)=>a-b).map(n=>`<option value="${n}" ${v.rate===n?'selected':''}>${n}×${n===.95?' · suggested':n===1?' · normal':''}</option>`).join('')}</select></div><div class="row">${button('Preview Italian voice','voice-preview','','secondary small')}${button('Stop','stop-speech','','secondary small')}${button('Refresh voices','voices-refresh','','ghost small')}</div><p class="small muted mt" role="status">${v.selectedName?`${v.playing?'Playing':'Selected'}: ${esc(v.selectedName)}. ${v.missing?'Unavailable right now; no automatic replacement.':'This choice is pinned.'}`:'The first playback chooses a suggested available voice, then pins it.'}</p>`}<p class="small muted">Some browser-service voices need an internet connection. Voice names and the browser list cannot guarantee sound quality. If the selected voice disappears or errors, choose explicitly instead of accepting a silent fallback. Device voice preferences are separate from learning-data backups.</p>`;}
 function refreshVoicePanels(){const panel=$('#voice-panel');if(panel)panel.innerHTML=voicePanelHTML();}
 function voiceModal(){modal('Voice settings',`<div id="voice-panel">${voicePanelHTML()}</div>`);}
 function speak(text,day=null){speech.play(text,()=>{if(day){E.lesson(state,day).listenMode='audio';persist();const s=$('#listen-mode');if(s)s.value='audio';}});}
 async function record(){if(recorder.instance?.state==='recording'){recorder.instance.stop();return;}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('Use HTTPS or localhost in a supported browser, or record in Voice Memos.');return;}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder.stream=stream;const types=['audio/webm;codecs=opus','audio/mp4','audio/webm'];const mime=types.find(t=>MediaRecorder.isTypeSupported(t)),mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined),chunks=[];recorder.instance=mr;recorder.started=Date.now();mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(recorder.url)URL.revokeObjectURL(recorder.url);recorder.blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});recorder.url=URL.createObjectURL(recorder.blob);recorder.instance=null;render(true);toast('Recording ready. Play it back and download it before leaving.');};mr.onerror=()=>{stream.getTracks().forEach(t=>t.stop());recorder.instance=null;toast('Recording failed. Use your device’s recording app instead.');};mr.start();render(true);}catch(e){toast('Microphone unavailable or permission denied. Use a typed task or your device’s recorder.');}}
 function continuation(){const weak=E.topics(state).filter(t=>t.percent<80).slice(0,3).map(t=>t.title),focus=weak.length?weak.join(', '):'present/past contrast, listening for details and unscripted follow-ups';modal('Your next four-week cycle',`<p>Focus: <strong>${esc(focus)}</strong>.</p><ol class="checklist"><li><strong>Monday:</strong> 10 min due cards, 15 min weakest topic, 10 min dialogue, 10 min corrected original sentences.</li><li><strong>Tuesday:</strong> 10 min cards, 20 min understandable listening, 15 min spoken retelling.</li><li><strong>Wednesday:</strong> 10 min cards, 15 min a suitable A1/A2 topic, 20 min conversation or rehearsal.</li><li><strong>Thursday:</strong> 10 min cards, 20 min short reading, 15 min connected writing.</li><li><strong>Friday:</strong> 10 min cards, 15 min error repair, 20 min conversation.</li><li><strong>Saturday:</strong> 10 min cards, 15 min fresh input, 20 min an everyday task.</li><li><strong>Sunday:</strong> 15 min reviews, 10 min a cumulative quiz retake, 10 min listening and 10 min planning.</li></ol><p class="small muted">Repeat for four weeks using new messages, passages or conversations. Log time in the lab and retain card history. Advance the resource level only if you can understand the gist and communicate with manageable support.</p>${button('Open practice lab','goto','data-hash="lab"')}`);}
 function printProgramme(){const win=window.open('','_blank');if(!win){toast('Allow a new window to view the printable programme, or open Programme.html from the package.');return;}win.document.open();win.document.write(`<!doctype html><html lang="en"><meta charset="utf-8"><title>Italiano · 90-day programme</title><style>body{font:15px/1.6 system-ui;max-width:850px;margin:40px auto;padding:0 25px;color:#263b35}h1,h2{font-family:Georgia}h2{margin-top:35px}article{border-top:1px solid #ddd;padding:20px 0;break-inside:avoid}small{color:#64726b}button{padding:12px 20px}@media print{button{display:none}}</style><body><button onclick="window.print()">Print / Save as PDF</button><h1>Your 90-day Italian programme</h1><p>45 minutes per day: 15 structured learning, 10 retrieval, 10 listening, 10 speaking/writing. 67.5 scheduled hours. Study days move with your progress. No CEFR certificate or fluency deadline is implied.</p>${LESSONS.map(l=>`${l.day%7===1?`<h2>Week ${l.week} · ${WEEKS[l.week-1][0]}</h2><p>${WEEKS[l.week-1][1]}</p>`:''}<article><small>DAY ${l.day} · PHASE ${l.phase}</small><h3>${esc(l.title)}</h3><p><strong>Outcome:</strong> ${esc(l.goal)}</p><p><strong>15 min · Learn:</strong> ${esc(l.structured)}</p><p><strong>10 min · Recall:</strong> ${esc(l.vocabulary)}</p><p><strong>10 min · Listen:</strong> ${esc(l.listening)}</p><p><strong>10 min · Output:</strong> ${esc(l.output)}</p><p><strong>Companion:</strong> ${esc(RESOURCES.find(r=>r.id===l.external)?.name||'Online Italian Club')}; A1 index topic “${esc(l.oicTopic)}”. Links in the app are not live-verified.</p></article>`).join('')}</body></html>`);win.document.close();}
 async function action(el){const a=el.dataset.action,d=Number(el.dataset.day)||route.day||Math.min(E.currentDay(state),90),id=el.dataset.id;
  if(a==='skip-main'){$('#main').focus({preventScroll:true});}
  else if(a==='toggle-theme'){state.settings.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';persist();theme();}
  else if(a==='mark'){const part=el.dataset.part,l=E.lesson(state,d);if(l.checks.includes(part)){toast('Already marked. This does not add study time.');return;}if(part==='listen'&&!l.listenMode){toast('Choose whether you listened to audio or used the reading fallback first.');return;}if(part==='output'&&(l.speakRating===null||l.writeRating===null)){toast('Save your output self-ratings first. Use 0 for a skill you did not attempt.');return;}l.checks.push(part);l.startedAt||=E.iso();persist();render(true);toast('Activity marked. Log actual focused time separately.');}
  else if(a==='answer'){const result=E.answer(state,d,el.dataset.qid,el.dataset.value);persist();render(true);toast(result.correct?'Correct. Read the rule to consolidate it.':'Not quite. Read the answer and explanation before trying again.');}
  else if(a==='retry'){const old=E.latestAttempt(state,d);if(old&&Object.keys(old.answers).length&&!E.quizResult(state,d).complete){modal('Start another attempt?',`<p class="small muted">Your partial attempt is retained. The new attempt starts with no answers shown.</p><div class="modal-actions">${button('Keep practising','close-modal','','secondary')}${button('Start new attempt','retry-confirm',`data-day="${d}"`)}</div>`);}else{E.startAttempt(state,d);wordOrders={};persist();render(true);toast('Fresh attempt started. Earlier results remain in history.');}}
  else if(a==='retry-confirm'){E.startAttempt(state,d);wordOrders={};persist();closeModal();render(true);}
  else if(a==='token'){const qid=el.dataset.qid;(wordOrders[qid]||=[]).push(+el.dataset.index);render(true);}
  else if(a==='order-undo'){wordOrders[el.dataset.qid]?.pop();render(true);}
  else if(a==='order-clear'){wordOrders[el.dataset.qid]=[];render(true);}
  else if(a==='order-check'){const q=LESSONS[d-1].quiz.find(q=>q.id===el.dataset.qid),built=wordOrders[q.id]||[];if(built.length!==q.answers[0].split(' ').length){toast('Use all the words before checking.');return;}E.answer(state,d,q.id,built.map(i=>q.answers[0].split(' ')[i]).join(' '));persist();render(true);}
  else if(a==='complete'){const res=E.complete(state,d);if(!res.ok){toast(res.reason);return;}persist();render(true);toast(res.already?'This lesson is already complete.':`Day ${d} complete. ${d<90?'Your next study day is '+(d+1)+'.':'Your continuation cycle is ready.'}`);}
  else if(a==='reveal'){reviewAnswer=$('#recall-answer')?.value||'';revealed=true;render(true);}
  else if(a==='introduce'){const c=E.cardLibrary(state).find(c=>c.id===id),limit=state.settings.pace==='gentle'?Math.min(3,state.settings.vocabTarget):state.settings.vocabTarget;if(c.day>Math.max(d,Math.min(E.currentDay(state),90))||E.introducedToday(state)>=limit||!E.introduce(state,id)){toast('Introduction paused: review due cards first, check your target, or finish the prerequisite day.');return;}revealed=false;reviewAnswer='';persist();if($('#modal').open)closeModal();render(true);toast('Phrase introduced. Recall it now, then choose your review rating.');}
  else if(a==='rate-card'){const ok=E.review(state,id,el.dataset.rating);revealed=false;reviewAnswer='';reviewIndex=0;persist();render(true);toast(ok?'Recall saved. Next review: '+new Date(state.cards[id].nextReview).toLocaleString():'This card is already scheduled; no duplicate review was added.');}
  else if(a==='card-details')cardModal(id);
  else if(a==='add-card')addCardModal();
  else if(a==='listen-retry'){E.lesson(state,d).listenAnswers={};persist();render(true);}
  else if(a==='listen-answer'){E.lesson(state,d).listenAnswers[el.dataset.index]=el.dataset.value;persist();render(true);}
  else if(a==='dialogue')speak(TOPICS[LESSONS[d-1].topic].dialogue,d);
  else if(a==='speak')speak(el.dataset.text);
  else if(a==='stop-speech')speech.stop();
  else if(a==='voice-settings')voiceModal();
  else if(a==='voice-preview')speech.play('Ciao! Mi chiamo Jannik. Vorrei un caffè, per favore.');
  else if(a==='voices-refresh')speech.refresh();
  else if(a==='tutor')tutorModal(d,el.dataset.scenario||LESSONS[d-1].goal);
  else if(a==='copy-tutor')await copy(E.tutor(state,d,LESSONS[d-1].goal));
  else if(a==='copy-prompt')await copy($('#tutor-prompt').value);
  else if(a==='topic')topicModal(el.dataset.topic);
  else if(a==='goto'){closeModal();location.hash=el.dataset.hash;}
  else if(a==='close-modal')closeModal();
  else if(a==='export')exportData();
  else if(a==='csv'){download('Italiano-vocabulary.csv','text/csv;charset=utf-8',E.csv(state));toast('CSV download requested. Map its columns when importing into Anki.');}
  else if(a==='logs-csv'){const safe=x=>'"'+String(x??'').replace(/"/g,'""').replace(/^([=+@-])/,'\'$1')+'"';download('Italiano-study-history.csv','text/csv;charset=utf-8','\uFEFF'+[['Date','Minutes','Skill','Mode','Day','Note'],...state.logs.map(l=>[l.date,l.minutes,l.skill,l.mode,l.lessonDay,l.note])].map(r=>r.map(safe).join(',')).join('\r\n'));}
  else if(a==='import')$('#import-file').click();
  else if(a==='confirm-import'){if(!pendingImport)return;const next=pendingImport;exportData();state=next;saveBlocked=false;try{lastSaved=storage.getItem(E.KEY);}catch{}persist();closeModal();revealed=false;wordOrders={};render();toast(saveError?'Backup loaded in memory; export before closing.':'Backup imported and saved on this browser.');}
  else if(a==='log')logModal(id,d);
  else if(a==='delete-log'){modal('Delete this time entry?',`<p class="small muted">This only removes the selected study-time log. Lesson completion and quiz history are unchanged.</p><div class="modal-actions">${button('Cancel','close-modal','','secondary')}${button('Delete entry','delete-log-confirm',`data-id="${esc(id)}"`,'danger')}</div>`);}
  else if(a==='delete-log-confirm'){state.logs=state.logs.filter(x=>x.id!==id);persist();closeModal();render(true);toast('Time entry removed.');}
  else if(a==='reset')modal('Reset learning data?',`<p>Your lesson history, card schedules, drafts and logs on this browser will be removed. Download a backup first if you want to keep them.</p><div class="modal-actions">${button('Export first','export','','secondary')}${button('Cancel','close-modal','','secondary')}${button('Reset this browser','reset-confirm','','danger')}</div>`);
  else if(a==='reset-confirm'){state=E.fresh();saveBlocked=false;try{lastSaved=storage.getItem(E.KEY);}catch{}persist();revealed=false;wordOrders={};timer.elapsed=0;timer.running=false;closeModal();location.hash='dashboard';render();toast('Fresh learner profile ready.');}
  else if(a==='timer-start')startTimer(el.dataset.skill||'grammar',d);
  else if(a==='timer-pause'){if(timer.running)pauseTimer();else{timer.started=performance.now();timer.running=true;autoPaused=false;renderTimer();}}
  else if(a==='timer-save')saveTimer();
  else if(a==='timer-discard'){timer.running=false;timer.elapsed=0;closeModal();renderTimer();}
  else if(a==='record')await record();
  else if(a==='download-recording'&&recorder.blob)download(`Italiano-speaking-${E.localDay()}.${recorder.blob.type.includes('mp4')?'m4a':'webm'}`,recorder.blob.type,recorder.blob);
  else if(a==='print-programme')printProgramme();
  else if(a==='continuation')continuation();
 }
 function submit(form){const fd=new FormData(form),data=Object.fromEntries(fd),type=form.dataset.form,d=Number(form.dataset.day)||route.day;
  if(type==='answer'){const value=data.answer.trim();if(!value){toast('Try an answer first.');return;}const result=E.answer(state,d,form.dataset.qid,value);persist();render(true);toast(result.correct?'Correct.':'Not quite. The answer and explanation are shown below the question.');}
  else if(type==='listening'){const l=E.lesson(state,d);l.notes=data.notes.slice(0,10000);l.listenRating=Number(data.listenRating);persist();toast('Listening reflection saved.');}
  else if(type==='output'){const l=E.lesson(state,d);l.draft=data.draft.slice(0,20000);l.speakRating=Number(data.speakRating);l.writeRating=Number(data.writeRating);persist();toast('Draft and self-ratings saved.');}
  else if(type==='milestone'){state.assessments[d]={at:E.iso(),notes:data.notes.slice(0,10000),ratings:Object.fromEntries(['listening','reading','speaking','writing'].map(k=>[k,Number(data[k])]))};persist();toast('Milestone self-assessment saved.');}
  else if(type==='bookmarks'){state.lab={ltTrack:Number(data.ltTrack),coffeeEpisode:Number(data.coffeeEpisode)};persist();toast('Resource bookmarks saved.');}
  else if(type==='settings'){const days=fd.getAll('days').map(Number);if(!days.length){toast('Choose at least one study day.');return;}const proposed={...state,settings:{name:data.name.trim(),startDate:data.startDate,dailyMinutes:Number(data.dailyMinutes),days,session:data.session,theme:data.theme,vocabTarget:Number(data.vocabTarget),reviewCap:Number(data.reviewCap),explanations:data.explanations,pace:data.pace}};try{state=E.validate(E.backup(proposed));}catch(e){toast(e.message);return;}persist();render(true);toast('Study preferences saved.');}
  else if(type==='log'){try{E.log(state,{...data,id:data.id||undefined,minutes:Number(data.minutes),lessonDay:Number(data.lessonDay)||null});persist();closeModal();render(true);toast('Study history updated.');}catch(e){toast(e.message);}}
  else if(type==='add-card'){const it=data.it.trim();if(E.cardLibrary(state).some(c=>E.normalize(c.it)===E.normalize(it))){toast('This Italian phrase is already in your library.');return;}state.customCards.push({id:'custom-'+E.uid(),it,en:data.en.trim(),example:data.example.trim(),de:data.de.trim(),note:data.note.trim(),topic:'custom',day:Math.min(E.currentDay(state),90)});persist();closeModal();render(true);toast('Phrase added to your library.');}
 }
 function events(){document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled){e.preventDefault();try{await action(el);}catch(err){toast('That action could not finish: '+err.message);}}});document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(f){e.preventDefault();try{submit(f);}catch(err){toast('Please check this entry: '+err.message);}}});document.addEventListener('input',e=>{if(e.target.dataset.input==='vocab-search'){filterText=e.target.value;$('#vocab-table').innerHTML=vocabTable();}});document.addEventListener('change',e=>{const el=e.target,type=el.dataset.change;if(el.id==='import-file'){importFile(el.files[0]);el.value='';}if(type==='italian-voice'){speech.choose(el.value);return;}if(type==='italian-rate'){speech.setRate(el.value);return;}if(type==='session'){state.settings.session=el.value;persist();render(true);}else if(type==='vocab-filter'){filterState=el.value;$('#vocab-table').innerHTML=vocabTable();}else if(type==='resource-skill'){resourceSkill=el.value;$('#resource-grid').innerHTML=resourceCards();}else if(type==='resource-level'){resourceLevel=el.value;$('#resource-grid').innerHTML=resourceCards();}else if(type==='lesson-value'){E.lesson(state,+el.dataset.day)[el.dataset.field]=el.value;persist();}});$('#modal').addEventListener('close',()=>document.body.classList.remove('modal-open'));window.addEventListener('hashchange',()=>{if($('#modal').open)closeModal();revealed=false;reviewAnswer='';render();$('#main').focus({preventScroll:true});});document.addEventListener('visibilitychange',()=>{if(document.hidden&&timer.running){pauseTimer();autoPaused=true;}else if(!document.hidden&&autoPaused){toast('Focus timer paused while this tab was hidden. Resume it when ready, or log external study manually.');autoPaused=false;}});window.addEventListener('storage',e=>{if(e.key===E.KEY&&e.newValue!==lastSaved){saveBlocked=true;saveError='Learning data changed in another tab. Export this session if needed, then reload. Saving is paused to protect both versions.';renderStorage();}});window.addEventListener('beforeunload',e=>{if(timer.running||timer.elapsed||recorder.instance?.state==='recording'){e.preventDefault();e.returnValue='';}});window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(state.settings.theme==='system')theme();});}
 function init(){shell();events();render();setInterval(renderTimer,1000);if(!loaded.error&&lastSaved===null)persist();speech.refresh();if(location.protocol==='https:'&&'serviceWorker'in navigator&&/\/index\.html$|\/$/.test(location.pathname))navigator.serviceWorker.register('./sw.js').catch(()=>{});}
 return {init,getState:()=>state,render,action,submit,importFile,persist,parseRoute,normalize:E.normalize};
})();
